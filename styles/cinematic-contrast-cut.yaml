# Signature: cinematic contrast cut
# Built from: https://www.instagram.com/reel/DftsuELx22y/ (Fred Vermeij, 12.5 s, Lapland travel edit shown over a Premiere timeline)

name: cinematic-contrast-cut
credit: ["Fred Vermeij (Instagram)"]

format: >
  9:16 split: 16:9 cinematic clip in the top ~40%, the editor timeline (screen recording) below.
  For our own reels, use the clip full-frame; the timeline half is a "how I edit" framing device only.

rules:  # from the creator's caption, confirmed in the frames
  - "cut on movement: the motion direction matches across the cut (hand left -> car left)"
  - "contrast every cut: wide->close, dark->bright, still->moving; never two similar shots in a row"
  - "short shots: ~0.5-2 s, only the hero moment holds longer"
  - "sound design does half the work: whoosh on wipes, click/hit on flashes and title"
  - "transitions only on movement (wipe follows the subject's motion)"
  - "animated text in the first second says what the video is (serif title 'LAPLAND' fading in over a silhouette)"

sequence_seen:
  - "0-1 s: headlight close-up -> rider silhouette (dark close -> dark wide), red hook caption on top"
  - "1-3 s: husky sled line at sunset, wide"
  - "3-5 s: silhouette + serif title 'LAPLAND' fades in, then a black flash with breath/steam"
  - "5-8 s: snowmobile POV close -> mirror -> snowmobile approaching from far (still -> moving)"
  - "8-11 s: orange horizon -> blue frozen lake -> sunset reflection -> aerial snowy forest push"
  - "11-12.5 s: person walking into forest (ending moment)"

grade: "teal-cyan shadows and snow, orange sunset highlights (teal/orange), deep crushed blacks, low saturation in mids"
text: "thin serif, spaced caps, white with soft glow, centred lower-third"
audio: "music + whooshes and hits on cuts"
