<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- "5 Pull-Up Tips" - Dr Mak Fitness original short (9:16). The owner's Hinglish dr mak voice-over,
     the channel's red/black edit (Anton titles, yellow keyword captions, red slash cuts, punch-ins,
     grain) and the real-anatomy 3D athlete (Z-Anatomy, CC BY-SA 4.0), always filmed from behind.
     Driven by render.mjs: setShort(timeline) then renderAt(t). -->
<style>
  @font-face { font-family: Anton; src: url(__ASSETS__anton.woff2); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #050506; }
  .abs { position: absolute; }
  #bg, #fg { position: absolute; inset: 0; overflow: hidden; }
  #gl, #bloom { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .a { font-family: Anton, Impact, sans-serif; letter-spacing: .01em; line-height: .95; color: #fff; text-transform: uppercase; }
</style>
<script src="__ASSETS__three.min.js"></script>
<script src="__RENDER__anatomy3d.js"></script>
</head>
<body>
<div id="bg"></div><canvas id="gl" width="1080" height="1920"></canvas><canvas id="bloom" width="540" height="960"></canvas><div id="fg"></div>
<script>
let T = 0, TL = null, G = { name: "redblack", acc: "#FF1F2D" }, ASSET = "__ASSETS__", GRAIN = "";
const RED = "#FF1F2D", YEL = "#FFD21E", GRN = "#2EE86A";
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (a, b) => clamp((T - a) / (b - a));
const easeOut = p => 1 - Math.pow(1 - clamp(p), 3);
const easeInOut = p => { p = clamp(p); return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
const back = p => { const c = 1.7; p = clamp(p); return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const rep = (u, period, lo = 0, hi = 1) => lerp(lo, hi, .5 - .5 * Math.cos(2 * Math.PI * u / period));
const pop = (t0, d = .35) => { const p = back(prog(t0, t0 + d)); return `opacity:${clamp(prog(t0, t0 + d) * 3)};transform:scale(${lerp(.6, 1, p)})`; };
const svg = x => `<svg class="abs" style="inset:0;overflow:visible;z-index:20" width="1080" height="1920">${x}</svg>`;

// ---------------- scenes: pose + camera (always behind the athlete) + graphics ----------------
const SC = {
  hook: (u, s) => ({ st: { p: rep(Math.max(0, u - .2), 1.7, 0, .95), glow: { lats: [0, .4 + .6 * rep(Math.max(0, u - .2), 1.7)] },
      cam: { az: lerp(.7, .3, easeOut(u / s.dur)), el: -.12, dist: lerp(5.8, 4.9, easeOut(u / s.dur)), look: V3(0, 1.94, 0), fov: 30 } },
    gfx: () => `<div class="abs a" style="left:0;right:0;top:250px;text-align:center;font-size:150px;z-index:30;transform:scale(${1 + .3 * Math.exp(-T * 8)})"><span style="color:${YEL}">5</span> PULL-UP</div>
      <div class="abs a" style="left:0;right:0;top:400px;text-align:center;z-index:30;${pop(.25)}"><span style="display:inline-block;padding:0 34px;background:${RED};font-size:150px;transform:rotate(-3deg);box-shadow:0 0 70px ${RED}">TIPS</span></div>` }),
  deadhang: (u, s) => { const hold = u < 1.3, set = easeInOut(prog(s.start + .5, s.start + 1.2));
    return { st: { p: hold ? 0 : rep(u - 1.3, 2.2, 0, .9), shrug: hold ? 1 - set : 0, depress: set, glow: { lats: [0, .2 + .7 * set], traps: [RED, hold ? (1 - set) * .7 : 0] },
      cam: { az: lerp(.25, .05, u / s.dur), el: .12, dist: lerp(4.6, 4.0, u / s.dur), look: V3(0, 1.97, 0) } },
      gfx: J => pin(J.latR, "SHOULDERS DOWN", GRN, s.start + 1.0, -1) }; },
  grip: (u, s) => { const k = easeInOut(prog(s.start + 1.6, s.start + 2.8));
    return { st: { p: .05 + .05 * Math.sin(u * 2), glow: { forearms: [0, .8] },
      cam: { az: lerp(.35, .2, u / s.dur), el: lerp(.12, .06, k), dist: lerp(2.3, 4.6, k), look: V3(lerp(-.2, 0, k), lerp(2.12, 1.97, k), 0), fov: 30 } },
      gfx: () => `<div class="abs" style="left:0;right:0;top:1180px;text-align:center;z-index:30;${pop(s.start + .7)}"><span class="a" style="display:inline-block;padding:12px 30px;border-radius:18px;background:${GRN};color:#04140a;font-size:58px">THUMBS AROUND</span></div>` }; },
  core: (u, s) => ({ st: { p: rep(u, 1.9, .05, .92), lean: -.03, legSwing: .06, knee: .12, glow: { core: [0, .9], lats: [0, .5] },
      cam: { az: lerp(.75, .55, u / s.dur), el: .04, dist: 5.6, look: V3(0, 1.72, 0) } },
    gfx: J => { const [x, y] = proj(J.waist), b = easeOut(prog(s.start + .3, s.start + .7)), k = lerp(1.6, 1, b);
      return svg(`<g transform="translate(${x} ${y}) scale(${k})" opacity="${b}" fill="none" stroke="${GRN}" stroke-width="9" stroke-linecap="round"><path d="M-95 -120 h-28 v56 M95 -120 h28 v56 M-95 120 h-28 v-56 M95 120 h28 v-56"/></g>`)
        + pin(J.foot, "NO SWING", GRN, s.start + 1.2, 1); } }),
  range: (u, s) => { const p = rep(u, 2.3, 0, 1);
    return { st: { p, glow: { lats: [0, .3 + .65 * p] }, cam: { az: .12, el: .03, dist: lerp(6.4, 6.0, u / s.dur), look: V3(0, 1.74, 0) } },
      gfx: () => { const [, ay] = proj(V3(0, BAR_Y, 0)), [, hy] = proj(V3(0, BAR_Y - .62, 0)), o = easeOut(prog(s.start + .2, s.start + .6));
        return svg(`<g opacity="${o}"><line x1="40" y1="${ay - 60}" x2="1040" y2="${ay - 60}" stroke="${YEL}" stroke-width="5" stroke-dasharray="20 12"/><text x="50" y="${ay - 76}" font-family="Anton" font-size="40" fill="${YEL}">CHIN OVER BAR</text>
          <line x1="40" y1="${hy}" x2="1040" y2="${hy}" stroke="${GRN}" stroke-width="5" stroke-dasharray="20 12"/><text x="50" y="${hy + 50}" font-family="Anton" font-size="40" fill="${GRN}">FULL DEAD HANG</text></g>`)
          + meter("RANGE", p); } }; },
  tempo: (u, s) => { const up = .6, p = u < up ? easeInOut(u / up) : Math.max(0, 1 - (u - up) / 2.2), n = u < up ? 0 : Math.min(3, 1 + Math.floor((u - up) / .72));
    return { st: { p, glow: { lats: [0, .25 + .7 * p] }, cam: { az: lerp(.3, .1, u / s.dur), el: .06, dist: 4.9, look: V3(0, 1.87, 0) } },
      gfx: () => n ? `<div class="abs a" style="left:70px;top:760px;font-size:260px;color:${YEL};z-index:30;transform:scale(${1 + .35 * Math.exp(-((u - up) % .72) * 9)})">${n}</div>
        <div class="abs a" style="left:76px;top:1030px;font-size:44px;color:#ddd;z-index:30">SEC</div>` : "" }; },
  end: (u, s) => { const click = s.start + 2.4, done = T >= click, press = done && T < click + .15 ? .9 : 1;
    return { st: { p: .92 + .04 * Math.sin(u * 2.2), glow: { lats: [0, .8 + .2 * Math.sin(T * 5)], back: [0, .6] },
      cam: { az: lerp(-.3, .35, easeInOut(u / s.dur)), el: .1, dist: lerp(7.6, 7.0, easeOut(u)), look: V3(0, 1.57, 0) } },
      gfx: () => `<div class="abs a" style="left:0;right:0;top:1060px;text-align:center;font-size:118px;z-index:30;${pop(s.start + .15)}">DR MAK FITNESS</div>
        <div class="abs" style="left:0;right:0;top:1185px;text-align:center;font:800 44px Inter;color:${RED};z-index:30;${pop(s.start + .3)}">@drmakfitness</div>
        <div class="abs" style="left:0;right:0;top:1290px;text-align:center;z-index:30;${pop(s.start + .45)}"><span style="display:inline-block;transform:scale(${press});padding:26px 70px;border-radius:999px;font:900 54px Inter;color:#fff;background:${done ? "#2A2A2E" : RED};box-shadow:${done ? "none" : "0 0 50px " + RED}">${done ? "✓ Subscribed" : "▶ Subscribe"}</span></div>` }; },
};
function pin(pt, text, col, t0, side) {
  if (T < t0 || !pt) return "";
  const [x, y] = proj(pt), p = easeOut(prog(t0, t0 + .35));
  if (side > 0 && x + 560 > 1060) side = -1; else if (side < 0 && x - 560 < 20) side = 1;
  const lx = x + side * 160 * p, ly = y - 70 * p;
  return svg(`<circle cx="${x}" cy="${y}" r="${18 + 8 * Math.sin(T * 8)}" fill="none" stroke="${col}" stroke-width="6" opacity="${p}"/><line x1="${x}" y1="${y}" x2="${lx}" y2="${ly}" stroke="${col}" stroke-width="5" opacity="${p}"/>`)
    + `<div class="abs" style="left:${side > 0 ? lx + 8 : lx - 408}px;top:${ly - 32}px;width:400px;text-align:${side > 0 ? "left" : "right"};z-index:22;opacity:${p}"><span class="a" style="display:inline-block;padding:8px 18px;border-radius:12px;font-size:40px;background:${col};color:${col === GRN ? "#04140a" : "#fff"}">${text}</span></div>`;
}
function meter(label, v) {
  return `<div class="abs" style="left:900px;top:760px;width:130px;height:400px;border-radius:28px;background:rgba(24,4,6,.78);box-shadow:0 0 0 3px rgba(255,31,45,.55) inset;z-index:25">
    <div class="abs" style="left:44px;top:26px;width:42px;height:290px;border-radius:21px;background:rgba(255,255,255,.12);overflow:hidden"><div class="abs" style="left:0;right:0;bottom:0;height:${290 * clamp(v)}px;background:${GRN};box-shadow:0 0 30px ${GRN}"></div></div>
    <div class="abs a" style="left:0;right:0;top:328px;text-align:center;font-size:44px">${Math.round(100 * v)}%</div></div>`;
}

// ---------------- chrome: tip tag + title, progress, captions ----------------
function head(s) {
  if (!s.title) return "";
  return `<div class="abs" style="left:0;right:0;top:230px;display:flex;gap:14px;justify-content:center;z-index:30">${[1, 2, 3, 4, 5].map(i => `<div style="width:${i === s.n ? 70 : 34}px;height:12px;border-radius:6px;background:${i < s.n ? GRN : i === s.n ? YEL : "rgba(255,255,255,.22)"}"></div>`).join("")}</div>
    <div class="abs" style="left:0;right:0;top:282px;text-align:center;z-index:30;${pop(s.start)}"><span style="display:inline-block;padding:10px 26px;border-radius:999px;font:800 30px Inter;letter-spacing:.16em;color:#111;background:${YEL}">TIP ${s.n}</span></div>
    <div class="abs a" style="left:30px;right:30px;top:352px;text-align:center;font-size:${s.title.length > 10 ? 120 : 140}px;z-index:30;transform:scale(${1 + .45 * Math.exp(-(T - s.start) * 10)});text-shadow:0 8px 40px rgba(0,0,0,.6)">${s.title}</div>`;
}
function captions() {
  const W = TL.words, i = W.findIndex(w => T >= w.s && T < w.e + .2);
  if (i < 0 || TL.scenes[sceneIdx(T)].kind === "end") return "";
  const line = W[i].line; let a = i; while (a > 0 && W[a - 1].line === line && i - a < 2 && !/[.,?]$/.test(W[a - 1].w)) a--;
  let b = a; while (b + 1 < W.length && W[b + 1].line === line && b - a < 2 && !/[.,?]$/.test(W[b].w)) b++;
  if (i > b) return "";
  return `<div class="abs" style="left:50px;right:50px;top:1330px;display:flex;flex-wrap:wrap;justify-content:center;gap:0 22px;z-index:50">${W.slice(a, b + 1).map((w, k) => {
    const cur = a + k === i, col = cur ? YEL : w.hl ? RED : "#fff";
    return `<span class="a" style="display:inline-block;font-size:96px;color:${col};-webkit-text-stroke:3px #000;text-shadow:0 7px 0 #000,0 0 30px rgba(0,0,0,.8);transform:scale(${cur ? 1.1 : 1});opacity:${a + k <= i ? 1 : .4}">${w.w.replace(/[,.]$/, "")}</span>`;
  }).join("")}</div>`;
}
function background() {
  const fl = .85 + .15 * Math.sin(T * 7.3) * Math.sin(T * 3.1);
  const tubes = [110, 290, 790, 970].map((x, i) => `<div class="abs" style="left:${x}px;top:-40px;width:12px;height:2000px;background:linear-gradient(#ff2a3a00,#ff2a3a ${30 + i * 8}%,#ff2a3a00);opacity:${(.16 + .07 * Math.sin(T * 2 + i)) * fl};filter:blur(3px);box-shadow:0 0 60px 18px rgba(255,20,40,.22)"></div>`).join("");
  return `<div class="abs" style="inset:0;background:radial-gradient(90% 55% at 50% 42%,#3B0308 0%,#14020360 45%,#050506 80%)"></div>${tubes}
    <div class="abs" style="inset:0;background:radial-gradient(70% 45% at 50% 105%,rgba(160,0,12,.5),transparent 70%)"></div>`;
}
function finish() {
  const ox = Math.floor(T * 30 * 97) % 300, oy = Math.floor(T * 30 * 53) % 300;
  return `<div class="abs" style="inset:0;background:radial-gradient(75% 60% at 50% 45%,transparent 50%,rgba(0,0,0,.72) 100%);z-index:60"></div>
    <div class="abs" style="inset:-300px;background-image:url(${GRAIN});background-position:${ox}px ${oy}px;opacity:.09;mix-blend-mode:screen;z-index:61"></div>
    <div class="abs" style="left:0;top:0;height:9px;width:${1080 * T / TL.dur}px;background:${RED};z-index:62"></div>
    <div class="abs" style="left:60px;top:150px;font:800 30px Inter;color:#c9b3b3;z-index:62"><span style="color:${RED}">●</span> @drmakfitness</div>`;
}

// ---------------- frame ----------------
const sceneIdx = t => { let k = 0; TL.scenes.forEach((s, i) => { if (t >= s.start - 1e-4) k = i; }); return k; };
const isV = v => v && v.isVector3;
function mix(a, b, k) {
  if (a === undefined) return b; if (b === undefined) return a;
  if (typeof a === "number" && typeof b === "number") return lerp(a, b, k);
  if (isV(a) && isV(b)) return a.clone().lerp(b, k);
  if (Array.isArray(a) && Array.isArray(b)) return [k < .5 ? a[0] : b[0], lerp(a[1], b[1], k)];
  if (typeof a === "object" && typeof b === "object") { const o = {}; for (const key of new Set([...Object.keys(a), ...Object.keys(b)])) o[key] = mix(a[key], b[key], k); return o; }
  return k < .5 ? a : b;
}
const DEF_CAM = { az: .3, el: .06, dist: 6, fov: 28, look: null };
function stAt(k, t) { const s = TL.scenes[k], keep = T; T = t; const o = SC[s.kind](t - s.start, s); T = keep; o.st.cam = { ...DEF_CAM, look: V3(0, 1.75, 0), ...o.st.cam }; return o; }
function withZeros(a, b) { for (const g of Object.keys(b.glow ?? {})) { a.glow = a.glow ?? {}; a.glow[g] = a.glow[g] ?? [b.glow[g][0], 0]; } }
window.setShort = async tl => {
  TL = tl;
  const c = document.createElement("canvas"); c.width = c.height = 300; const x = c.getContext("2d"), d = x.createImageData(300, 300);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); GRAIN = c.toDataURL();
  await loadAnatomy(); build3D();
  return TL.dur;
};
window.renderAt = t => {
  T = t;
  const k = sceneIdx(t), s = TL.scenes[k], u = t - s.start, cur = stAt(k, t);
  let st = cur.st;
  if (k > 0 && u < .5) { const prev = stAt(k - 1, t).st, A = { ...prev }, B = { ...st }; withZeros(A, B); withZeros(B, A); st = mix(A, B, easeInOut(u / .5)); }
  T = t; pose(st); R3.renderer.render(R3.scene, R3.cam);
  const bl = document.getElementById("bloom"), bx = bl.getContext("2d");
  bx.clearRect(0, 0, 540, 960); bx.filter = "brightness(.85) contrast(2.4) saturate(1.4) blur(14px)"; bx.drawImage(document.getElementById("gl"), 0, 0, 540, 960);
  bl.style.cssText = "mix-blend-mode:screen;opacity:.55";
  document.getElementById("gl").style.filter = "contrast(1.12) saturate(1.15)";
  document.getElementById("bg").innerHTML = background();
  let body = cur.gfx(R3.joints) + head(s);
  // punch-in + shake on every cut (cut beats also carry a whoosh in the mix)
  if (k > 0 && u < .5) { const kk = Math.exp(-u * 8); body = `<div class="abs" style="inset:0;transform:scale(${1 + .06 * kk}) translateX(${Math.sin(u * 90) * 10 * kk}px)">${body}</div>`; }
  let h = body + captions();
  if (k > 0 && u < .22) { const y = 1920 - 2400 * easeInOut(u / .22); h += `<div class="abs" style="left:-120px;right:-120px;top:${y}px;height:200px;background:${RED};transform:skewY(-9deg);box-shadow:0 0 90px ${RED};z-index:55"></div>`; }
  document.getElementById("fg").innerHTML = h + finish();
};
</script>
</body>
</html>
