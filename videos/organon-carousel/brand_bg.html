<!doctype html><html><head><meta charset="utf-8"><title>Brand Background</title><style>
/* Owner's brand backdrop (MK circle + name + tagline), rebuilt at 2000x1125 from their logo files. */
@font-face { font-family: "Lora"; src: url("assets/Lora.ttf"); font-weight: 400 700; }
*{margin:0;padding:0;box-sizing:border-box}
body{width:2000px;height:1125px;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#FAF9F6 0%,#F1EFEA 55%,#E6E4DF 100%);font-family:"Inter",sans-serif;position:relative}
.logo{position:absolute;left:50%;top:70px;width:640px;height:640px;margin-left:-320px;border-radius:50%;background:url(assets/mk_circle.png) center/104% no-repeat;
  -webkit-mask:radial-gradient(circle,#000 69%,transparent 70.5%)}
.name{position:absolute;left:0;right:0;top:770px;text-align:center;font-family:"Lora";font-weight:600;font-size:118px;color:#13254A;letter-spacing:-.5px}
.sub{position:absolute;left:0;right:0;top:905px;display:flex;justify-content:center;align-items:center;gap:34px;font-family:"Lora";font-weight:600;font-size:56px;letter-spacing:.09em;color:#0E6E6A}
.sub i{display:block;width:130px;height:3px;background:#13254A}
.tag{position:absolute;left:0;right:0;top:1000px;text-align:center;font-size:34px;font-weight:500;letter-spacing:.32em;color:#13254A}
.tag b{color:#C9A14A;font-size:28px;margin:0 22px}
</style></head><body><div class="logo"></div><div class="name">Dr. Mayurakshi Katiyar</div>
<div class="sub"><i></i>MK HEALTH &amp; HOMEOPATHY<i></i></div><div class="tag">HEALTH<b>●</b>HOMEOPATHY<b>●</b>KNOWLEDGE</div></body></html>
