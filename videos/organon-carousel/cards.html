<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Organon Cards</title>
<style>
  /* Same dark look as the psychiatry carousels and reel cards. Height follows the viewport (1350 carousel, 1920 reel). */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 100vh; overflow: hidden; background: #0A0C11; color: #fff; font-family: "Inter", sans-serif; }
  .page { position: absolute; inset: 0; background: #0A0C11; overflow: hidden; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 60px 60px; }
  .glow { position: absolute; border-radius: 50%; }
  .content { position: absolute; left: 80px; right: 80px; top: 0; bottom: 110px; display: flex; flex-direction: column; justify-content: center; gap: 40px; }
  .kicker { font-weight: 800; font-size: 26px; letter-spacing: .22em; text-transform: uppercase; color: #FFD23F; }
  .num { font-family: "Inter Display"; font-weight: 900; font-size: 150px; line-height: .9; letter-spacing: -.03em; color: #3DDC97; }
  .title { font-family: "Inter Display"; font-weight: 900; font-size: 76px; line-height: 1.04; letter-spacing: -.03em; }
  .quote { font-family: "Inter Display"; font-style: italic; font-weight: 500; font-size: 36px; line-height: 1.35; color: rgba(255,255,255,.82); padding: 22px 30px; border-left: 8px solid #FFD23F; background: rgba(255,210,63,.07); border-radius: 0 18px 18px 0; }
  .pts { display: flex; flex-direction: column; gap: 22px; }
  .pt { display: flex; gap: 22px; align-items: center; font-family: "Inter Display"; font-weight: 800; font-size: 44px; line-height: 1.15; }
  .pt b { color: #3DDC97; }
  .dot { flex: none; width: 54px; height: 54px; border-radius: 50%; background: #3DDC97; color: #0A0C11; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 900; }
  @media (min-height: 1600px) { .content { top: 140px; bottom: 560px; } }  /* 9:16: keep clear of the reel caption band */
  .footer { position: absolute; left: 80px; right: 80px; bottom: 50px; display: flex; justify-content: space-between; align-items: center; font-size: 22px; font-weight: 700; color: rgba(255,255,255,.55); }
  .footer img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
window.show = (D, i) => {
  const s = D.slides[i], n = D.slides.length;
  document.getElementById("stage").innerHTML = `<div class="page"><div class="grid"></div>
  <div class="glow" style="left:-320px;top:-200px;width:1000px;height:1000px;background:radial-gradient(circle,#3DDC9722,transparent 65%)"></div>
  <div class="glow" style="right:-360px;bottom:-260px;width:1000px;height:1000px;background:radial-gradient(circle,#4DA3FF1c,transparent 65%)"></div>
  <div class="content">
    <div><div class="kicker">${D.kicker}</div><div class="num" style="margin-top:16px">§ ${s.no}</div></div>
    <div class="title">${s.title}</div>
    <div class="quote">“${s.quote}”</div>
    <div class="pts">${s.points.map((p, k) => `<div class="pt"><div class="dot">${k + 1}</div><div>${p}</div></div>`).join("")}</div>
  </div>
  <div class="footer"><span>${i + 1} / ${n}</span><span style="display:flex;align-items:center;gap:12px"><img src="assets/logo_mk.png">${D.author}</span><span>${D.source}</span></div></div>`;
};
</script>
</body>
</html>
