<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Case Sheet Board</title>
<style>
  /* Lower half of the split-screen reel (1080x960). show(state): state.tag + {id: progress 0..1} for written items. */
  @font-face { font-family: "Kalam"; src: url("assets/Kalam-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "Kalam"; src: url("assets/Kalam-Bold.ttf"); font-weight: 700; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 960px; overflow: hidden; background: #F7F7F2; font-family: "Inter", sans-serif; }
  .board { position: absolute; inset: 0; background: #F7F7F2; box-shadow: inset 0 0 0 14px #C9CED6, inset 0 0 0 18px #9AA3AE; }
  .t { position: absolute; left: 50px; top: 44px; font-family: "Inter Display"; font-weight: 900; font-size: 34px; letter-spacing: .14em; color: #1E2A2A; }
  .tag { position: absolute; right: 50px; top: 36px; font-family: "Inter Display"; font-weight: 900; font-size: 34px; color: #fff; background: #0E5F5C; border-radius: 12px; padding: 6px 18px; }
  .m { position: absolute; font-family: "Kalam"; font-weight: 700; line-height: 1.1; white-space: nowrap; }
  .k { color: #1B1F24; } .bl { color: #1F5FD1; } .rd { color: #D7263D; } .gr { color: #138A4B; } .gy { color: #6B7280; }
  .lbl { position: absolute; font-family: "Inter Display"; font-weight: 800; font-size: 22px; letter-spacing: .16em; color: #7A828C; }
  .vl { position: absolute; left: 560px; top: 130px; width: 3px; height: 400px; background: #C9CED6; }
  .hl { position: absolute; left: 50px; right: 50px; height: 3px; background: #C9CED6; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// the GAPS row and its ticks share one layout, so ticks drawn later land exactly after each word
const ROW = ticks => ["Neend", "Bhookh", "Pyaas", "Stool", "Mann"].map(w =>
  `<span style="color:${ticks ? "transparent" : "inherit"}">${w}</span> <span style="color:${ticks ? "#138A4B" : "transparent"}">✓</span>`).join(" · ").replace(/ · /g, ticks ? ' <span style="color:transparent">·</span> ' : " · ");
// id -> [class, left, top, font-size, html]
const ITEMS = {
  q1: ["gr", 0, 0, 28, "No prejudice ·"], q2: ["gr", 0, 0, 28, "Senses ·"], q3: ["gr", 0, 0, 28, "Attention ·"], q4: ["gr", 0, 0, 28, "Fidelity"],
  p1: ["k", 60, 165, 50, "1. \"Sar dard<br>&nbsp;&nbsp;&nbsp;&nbsp;rehta hai\""],
  chup: ["rd", 60, 290, 32, "🤐 Chup · roko mat"], words: ["gy", 64, 334, 28, "(uske words mein likho)"],
  line2: ["k", 60, 378, 48, "2. ........"], gap: ["gy", 300, 392, 30, "↕ gap chhodo"],
  c1: ["bl", 590, 160, 42, "Kab se?"], c2: ["bl", 800, 160, 42, "Kaisa?"], c3: ["bl", 590, 215, 42, "Kahan?"], c4: ["bl", 780, 215, 42, "Kitni der?"], c5: ["bl", 590, 270, 42, "Kab badhta?"],
  x1: ["rd", 60, 455, 40, "✗ \"Dhoop mein badhta?\""], v1: ["bl", 575, 455, 40, "✓ \"Kis cheez se badhta?\""],
  ticks: ["gr", 60, 628, 40, ROW(true)],
  gq: ["bl", 60, 688, 34, "General: \"Neend kaisi hai?\""], sq: ["bl", 520, 688, 34, "Special: \"Neend mein bolte ho?\""],
  d1: ["gr", 0, 0, 40, "Chehra ·"], d2: ["gr", 0, 0, 40, "Mood ·"], d3: ["gr", 0, 0, 40, "Zubaan ·"], d4: ["gr", 0, 0, 40, "Pulse ·"], d5: ["gr", 0, 0, 40, "Behaviour"],
  end: ["k", 60, 880, 34, "Patient ki story <span style='color:#0E5F5C'>+</span> doctor ka observation <span style='color:#0E5F5C'>= case-taking ✓</span>"],
};
// rows laid out by the browser (no hand-placed x), every span present so nothing shifts as items appear
const ROWS = { q: [325, 48, ["q1", "q2", "q3", "q4"]], d: [60, 806, ["d1", "d2", "d3", "d4", "d5"]] };
const clip = p => `clip-path:inset(-20px ${(100 - p * 100).toFixed(1)}% -20px -20px)`;
window.show = (st) => {
  const got = st.items || {};
  const rows = Object.values(ROWS).map(([x, y, ids]) => `<div class="m" style="left:${x}px;top:${y}px;display:flex;gap:12px">${ids.map(id => {
    const [c, , , fs, html] = ITEMS[id]; return `<span class="${c}" style="display:inline-block;font-size:${fs}px;${clip(got[id] || 0)}">${html}</span>`; }).join("")}</div>`).join("");
  const items = rows + Object.entries(got).filter(([id]) => !/^[qd]\d$/.test(id)).map(([id, p]) => {
    const [c, x, y, fs, html] = ITEMS[id];
    return `<div class="m ${c}" style="left:${x}px;top:${y}px;font-size:${fs}px;clip-path:inset(-20px ${(100 - p * 100).toFixed(1)}% -20px -20px)">${html}</div>`;
  }).join("");
  document.getElementById("stage").innerHTML = `<div class="board">
    <div class="t">CASE SHEET</div>${st.tag ? `<div class="tag">§ ${st.tag}</div>` : ""}
    <div class="lbl" style="left:60px;top:118px">PATIENT SAYS</div><div class="lbl" style="left:590px;top:118px">COMPLETE IT</div>
    <div class="vl"></div>
    <div class="hl" style="top:545px"></div>
    <div class="lbl" style="left:60px;top:565px">GAPS</div>
    <div class="m k" style="left:60px;top:628px;font-size:40px">${ROW(false)}</div>
    <div class="hl" style="top:752px"></div>
    <div class="lbl" style="left:60px;top:770px">DOCTOR SEES</div>
    ${items}</div>`;
};
</script>
</body>
</html>
