<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Refined "5 pull-up mistakes" short, 1080x1920. A procedural 3D athlete (three.js) does the
     reps; the motion graphics (titles, stamps, meters, arrows pinned to projected joints,
     captions) sit on top. Two grades share one timeline: porcelain (the launch-film look) and
     redblack (the channel's dark red look). Driven from render.mjs: setShort(timeline, grade)
     then renderAt(t) per frame. -->
<style>
  @font-face { font-family: Anton; src: url(__ASSETS__anton.woff2); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; }
  #bg, #fg { position: absolute; inset: 0; overflow: hidden; }
  #gl, #bloom { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #grade { position: absolute; inset: 0; pointer-events: none; }
</style>
<script src="__ASSETS__three.min.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <!-- photo grades: luminance -> tone curve per channel -->
  <filter id="duoP" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/><feComponentTransfer>
    <feFuncR type="table" tableValues="0.09 0.55 0.97"/><feFuncG type="table" tableValues="0.08 0.52 0.94"/><feFuncB type="table" tableValues="0.08 0.48 0.89"/></feComponentTransfer></filter>
  <filter id="duoR" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/><feComponentTransfer>
    <feFuncR type="table" tableValues="0 0.42 0.86 1"/><feFuncG type="table" tableValues="0 0.02 0.36 0.86"/><feFuncB type="table" tableValues="0 0.03 0.32 0.8"/></feComponentTransfer></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</svg>
<div id="bg"></div><canvas id="gl" width="1080" height="1920"></canvas><canvas id="bloom" width="540" height="960"></canvas><div id="grade"></div><div id="fg"></div>
<script>
let T = 0, TL = null, G = null, GRAIN = "";
const ASSET = "__ASSETS__";
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, p) => a + (b - a) * p;

const rep = (u, period, lo = 0, hi = 1) => lerp(lo, hi, .5 - .5 * Math.cos(2 * Math.PI * u / period));
// fade/slide/scale in from t0 (and optionally out at `until`)

  return `opacity:${op};transform:translateY(${(1 - e) * (o.dy ?? 40)}px) scale(${lerp(o.scale ?? .9, 1, e)});filter:blur(${blur}px)`;
}

const THEMES = {
  porcelain: {
    name: "porcelain", bg: "#F4F0E8", ink: "#121212", sub: "#77736C", acc: "#E0262B", hl: "#E0262B", good: "#1F9D55",
    title: `font-family:'Inter Display';font-weight:800;letter-spacing:-.045em`, titleSize: 96, upper: false,
    cap: `font-family:'Inter Display';font-weight:800;letter-spacing:-.03em`, capSize: 66,
    card: "background:rgba(255,255,255,.72);box-shadow:0 30px 60px -28px rgba(40,30,20,.35),0 0 0 1px rgba(0,0,0,.04) inset;backdrop-filter:blur(20px)",
  },
  redblack: {
    name: "redblack", bg: "#050506", ink: "#FFFFFF", sub: "#C9B3B3", acc: "#FF1F2D", hl: "#FFD21E", good: "#2EE86A",
    title: `font-family:Anton;letter-spacing:.01em`, titleSize: 138, upper: true,
    cap: `font-family:Anton;letter-spacing:.02em`, capSize: 92,
    card: "background:rgba(24,4,6,.78);box-shadow:0 0 0 3px rgba(255,31,45,.55) inset,0 0 60px rgba(255,31,45,.35)",
  },

// ---------------- scene plan ----------------
const SCENES = [
  { id: "hook" }, { id: "promise", title: "5 MISTAKES" },
  { id: "m1", n: 1, bad: true, title: "SHRUGGING" }, { id: "f1", n: 1, title: "BLADES DOWN + BACK" },
  { id: "m2", n: 2, bad: true, title: "ARMS ONLY" }, { id: "f2", n: 2, title: "ELBOWS → RIBS" },
  { id: "m3", n: 3, bad: true, title: "LEG SWING" }, { id: "f3", n: 3, title: "CORE TIGHT" },
  { id: "m4", n: 4, bad: true, title: "HALF REPS" }, { id: "f4", n: 4, title: "FULL RANGE" },
  { id: "m5", n: 5, bad: true, title: "DROPPING" }, { id: "f5", n: 5, title: "3–5 SEC DOWN" },
  { id: "recap", title: "SAVE THIS" }, { id: "cta" },

const sceneAt = t => { let k = 0; SCENES.forEach((s, i) => { if (t >= TL.cues[s.id] - .001) k = i; }); return k; };

// ================= 3D athlete: real human anatomy (Z-Anatomy, CC BY-SA 4.0) =================
// anatomy.bin/.json come from tools/export_anatomy.py: every superficial muscle, tendon and bone of the
// Z-Anatomy figure plus skin for the head, hands and feet, skinned to a 19-bone skeleton. World units
// are metres; the athlete faces +z (the wall) and the camera sits behind, so we see the back.
const V3 = (x, y, z) => new THREE.Vector3(x, y, z), UP = V3(0, 1, 0);
const BAR_Y = 2.3, GRIP = .44;

let R3 = null, ANAT = null;
function loadBin(url) {
  return new Promise((res, rej) => { const x = new XMLHttpRequest(); x.open("GET", url); x.responseType = "arraybuffer";
    x.onload = () => res(x.response); x.onerror = rej; x.send(); });
}
async function loadAnatomy() {
  const [meta, bin] = await Promise.all([loadBin(ASSET + "anatomy.json").then(b => JSON.parse(new TextDecoder().decode(b))), loadBin(ASSET + "anatomy.bin")]);
  ANAT = { meta, bin };
}
// muscle shader: bulge along the normal when active, plus light pulsing along the body ("fibres firing")
function muscleMat(base, opts) {
  const m = new THREE.MeshPhysicalMaterial(opts);
  m.userData.u = { uAct: { value: 0 }, uTime: { value: 0 }, uHot: { value: new THREE.Color(0xff5a1f) } };
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, m.userData.u);
    sh.vertexShader = "uniform float uAct;\nvarying vec3 vRest;\n" + sh.vertexShader
      .replace("#include <begin_vertex>", "#include <begin_vertex>\n vRest = position;\n transformed += objectNormal * uAct * 0.0025;");
    sh.fragmentShader = "uniform float uAct; uniform float uTime; uniform vec3 uHot;\nvarying vec3 vRest;\n" + sh.fragmentShader
      .replace("#include <emissivemap_fragment>", `#include <emissivemap_fragment>

  };

function build3D() {

  renderer.setPixelRatio(1); renderer.setSize(1080, 1920, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = R ? 1.2 : 1.05;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.setClearColor(0x000000, 0);
  const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(28, 1080 / 1920, .1, 60);

  if (R) {
    scene.add(new THREE.HemisphereLight(0x4a1a1e, 0x050505, 1.0));
    const key = new THREE.DirectionalLight(0xfff0ea, 3.0); key.position.set(-2.5, 4, -5); key.castShadow = true; scene.add(key, key.target); shadowSetup(key);
    const fill = new THREE.DirectionalLight(0x9fb0ff, .55); fill.position.set(3, 1.5, -4); scene.add(fill);
    for (const [x, i] of [[-2.2, 70], [2.2, 70], [0, 30]]) { const l = new THREE.SpotLight(0xff2030, i, 12, .7, .6, 1.6); l.position.set(x, 3.3, 1.8); l.target.position.set(0, 1.7, 0); scene.add(l, l.target); }
  } else {
    scene.add(new THREE.HemisphereLight(0xffffff, 0xd8cdbd, 1.15));
    const key = new THREE.DirectionalLight(0xfff3e6, 2.6); key.position.set(-3, 5, -5); key.castShadow = true; scene.add(key, key.target); shadowSetup(key);
    const rim = new THREE.DirectionalLight(0xffffff, 1.6); rim.position.set(3, 3, 3); scene.add(rim);
    const side = new THREE.DirectionalLight(0xfff0e0, .8); side.position.set(4, 1, -2); scene.add(side);
  }
  function shadowSetup(l) { l.target.position.set(0, 1.6, 0); l.shadow.mapSize.set(2048, 2048); const c = l.shadow.camera; c.left = -1.6; c.right = 1.6; c.top = 1.8; c.bottom = -1.8; c.near = .5; c.far = 15; l.shadow.radius = 5; l.shadow.bias = -.0005; l.shadow.normalBias = .01; }

  wall.position.set(0, 2, .6); wall.rotation.y = Math.PI; wall.receiveShadow = true; scene.add(wall);
  const metal = new THREE.MeshStandardMaterial({ color: R ? 0xbdbdbd : 0xcfcfcf, metalness: .9, roughness: .22 });
  const frameM = new THREE.MeshStandardMaterial({ color: R ? 0x151012 : 0xd9d2c5, roughness: .6, metalness: .2 });
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(.016, .016, 1.7, 32), metal); bar.rotation.z = Math.PI / 2; bar.position.set(0, BAR_Y, 0); bar.castShadow = true; scene.add(bar);
  for (const x of [-.85, .85]) { const p = new THREE.Mesh(new THREE.BoxGeometry(.06, 3.2, .06), frameM); p.position.set(x, BAR_Y - 1.4, .12); p.castShadow = true; scene.add(p);
    const a = new THREE.Mesh(new THREE.BoxGeometry(.05, .05, .2), frameM); a.position.set(x, BAR_Y, .06); scene.add(a); }

  const bones = {};

  for (const n of M.bones) {
    const p = M.parent[n], r = V3(...M.rest[n]);

  }
  bones.root.updateMatrixWorld(true);
  const skel = new THREE.Skeleton(M.bones.map(n => bones[n]));

  const muscleBase = R ? 0x8a2326 : 0xa8322f;
  const mats = {};
  for (const g of HOT_GROUPS) mats[g] = muscleMat(muscleBase, { color: muscleBase, roughness: .42, metalness: 0, sheen: .8, sheenColor: new THREE.Color(R ? 0xff7070 : 0xffa0a0), sheenRoughness: .4, clearcoat: .3, clearcoatRoughness: .35 });
  const tendon = new THREE.MeshPhysicalMaterial({ color: R ? 0xcfc6ba : 0xece6dc, roughness: .28, clearcoat: .5, sheen: .4, sheenColor: new THREE.Color(0xffffff) });
  const boneM = new THREE.MeshStandardMaterial({ color: R ? 0xcdbfa6 : 0xe6dac2, roughness: .6 });
  const skinM = new THREE.MeshPhysicalMaterial({ color: R ? 0xa86d52 : 0xc68b66, roughness: .55, sheen: .5, sheenColor: new THREE.Color(0xffc8b0) });
  const hairM = new THREE.MeshStandardMaterial({ color: 0x120d0a, roughness: .85, side: THREE.DoubleSide });
  for (const c of M.chunks) {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(buf, c.position, c.verts * 3), 3));
    g.setAttribute("normal", new THREE.BufferAttribute(new Float32Array(buf, c.normal, c.verts * 3), 3));
    g.setAttribute("skinIndex", new THREE.BufferAttribute(new Uint16Array(buf, c.skinIndex, c.verts * 4), 4));
    g.setAttribute("skinWeight", new THREE.BufferAttribute(new Float32Array(buf, c.skinWeight, c.verts * 4), 4));
    g.setIndex(new THREE.BufferAttribute(new Uint32Array(buf, c.index, c.tris * 3), 1));
    const mat = c.material === "muscle" ? (mats[c.group] ?? mats.core) : c.material === "tendon" ? tendon : c.material === "bone" ? boneM : c.material === "hair" ? hairM : skinM;
    const m = new THREE.SkinnedMesh(g, mat); m.bind(skel, new THREE.Matrix4()); m.castShadow = true; m.frustumCulled = false; scene.add(m);
  }
  const rest = n => V3(...M.rest[n]);
  const len = (a, b) => rest(a).distanceTo(rest(b));
  const L = { ua: len("upperarm_l", "forearm_l"), fa: len("forearm_l", "hand_l") };
  R3 = { renderer, scene, cam, mats, bones, rest, L, joints: {} };
  pose({});
}
// 2-bone IK in 3D: elbow bends toward `pole`
function ik(S, H, a, b, pole) {
  const d = H.clone().sub(S), Ln = Math.min(d.length(), a + b - 1e-4), dir = d.clone().normalize();
  const x = (a * a - b * b + Ln * Ln) / (2 * Ln), h = Math.sqrt(Math.max(0, a * a - x * x));
  const n = pole.clone().sub(dir.clone().multiplyScalar(pole.dot(dir))).normalize();
  return S.clone().addScaledVector(dir, x).addScaledVector(n, h);
}
const _q = new THREE.Quaternion(), _q2 = new THREE.Quaternion();
const worldQ = b => b.getWorldQuaternion(new THREE.Quaternion());
const worldP = b => b.getWorldPosition(V3());
function setWorldQ(b, q) { b.quaternion.copy(worldQ(b.parent).invert().multiply(q)); b.updateMatrixWorld(true); }
// st: p (0 dead hang .. 1 chin over bar), shrug, lean (rad, + = legs forward), legSwing, knee,
//     glow: {group: [colour, amount]} (amount drives contraction + glow), cam: {az, el, dist, look, fov, shake}
function pose(st) {

  for (const b of Object.values(B)) b.quaternion.identity();
  B.root.position.copy(P.rest("root")); B.root.rotation.set(lean, 0, 0);
  B.chest.rotation.set(-.12 * p - .04, 0, 0); B.spine.rotation.set(-.05 * p, 0, 0);
  B.head.rotation.set(-.15 + .1 * p, 0, 0);

  const up = .55 + .3 * shrug - .12 * (st.depress ?? 0);
  B.clav_l.rotation.set(0, 0, up); B.clav_r.rotation.set(0, 0, -up);
  B.root.updateMatrixWorld(true);

  const SL = worldP(B.upperarm_l), Hy = BAR_Y - .055, reach = (P.L.ua + P.L.fa) * .985, dx = GRIP - Math.abs(SL.x);

    const S = worldP(ua), H = V3(sx * GRIP, Hy, -.02);
    const E = ik(S, H, P.L.ua, P.L.fa, V3(sx, -.35, -.55));

// world -> screen px
function proj(v) { if (!v) return [-999, -999]; const q = v.clone().project(R3.cam); return [(q.x + 1) / 2 * 1080, (1 - q.y) / 2 * 1920]; }

// previous scene's pose and camera blend into the new one so the whole short plays as one take.
let SKIP3D = false, COLLECT = null;

function stateAt(k, t) {

// ---------------- backgrounds ----------------
function background() {
  if (G.name === "porcelain")

function arrow(x1, y1, x2, y2, p, col, w = 14) {

  if (p <= 0) return "";
  return `<line x1="${x1}" y1="${y1}" x2="${x}" y2="${y}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>
    <path d="M${x + Math.cos(a) * 8} ${y + Math.sin(a) * 8} L${x - h * Math.cos(a - .5)} ${y - h * Math.sin(a - .5)} L${x - h * Math.cos(a + .5)} ${y - h * Math.sin(a + .5)} Z" fill="${col}"/>`;
}

  return `${tag}<div class="abs" style="left:40px;right:40px;top:370px;text-align:center;font-size:${s}px;line-height:1;color:${G.ink};${G.title};${appear(t0 + .06, { dy: 50 })}">${sc.title}</div>`;

function meter(label, v, x, y, col) {

function captions() {

  f5: t0 => { const u = T - t0, top = .7, p = u < top ? lerp(.2, 1, easeInOut(u / top)) : Math.max(0, 1 - (u - top) / 2.4);
    ath({ p, glow: { lats: [G.good, .8] }, cam: camPush(t0, { az: .3 + .3 * prog(t0, t0 + 3), el: .06 }) });
    const n = u < top ? 0 : Math.min(3, 1 + Math.floor((u - top) / .8));
    return (u < top ? "" : `<div class="abs" style="left:70px;top:820px;z-index:30;${G.title};font-size:240px;color:${G.good};transform:scale(${1 + .3 * Math.exp(-((u - top) % .8) * 9)})">${n}</div>
      <div class="abs" style="left:70px;top:1120px;z-index:30;font:800 30px Inter;letter-spacing:.16em;color:${G.sub}">SECONDS</div>`) + stamp(true, t0 + .2); },
  recap: t0 => { const items = ["No shrug", "Elbows to ribs", "No swing", "Full range", "Slow negative"], u = T - t0;
    ath({ p: rep(u, 2.4, .05, .95), glow: { lats: [G.good, .85 + .15 * Math.sin(T * 5)], core: [G.good, .5] }, cam: { az: .35 + .05 * u, el: .06, dist: 8.0, look: V3(-.85, 1.62, -.25) } });
    const step = (cue("check") - t0 - .2) / 5;
    return `<div class="abs" style="left:580px;top:620px;width:450px;border-radius:36px;padding:30px 30px;z-index:30;${G.card};${appear(t0, { dy: 60 })}">${items.map((s, i) => {
        const tk = t0 + .2 + i * step, ok = on(tk);
        return `<div style="display:flex;align-items:center;gap:22px;height:100px;font:800 40px Inter;color:${G.ink}">
          <span style="width:62px;height:62px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:38px;color:#fff;background:${ok ? G.good : "transparent"};border:4px solid ${ok ? G.good : G.sub};transform:scale(${ok ? 1 + .5 * Math.exp(-(T - tk) * 10) : 1})">${ok ? "✓" : ""}</span>${s}</div>`; }).join("")}</div>`
      + `<div class="abs" style="left:590px;top:1200px;z-index:30;${appear(cue("save"), { dy: 30 })};font:900 44px Inter;color:${G.ink}">🔖 Save for pull day</div>`; },
  cta: t0 => { const u = T - t0, click = cue("follow") + .25, done = on(click), press = done && T < click + .15 ? .9 : 1, R = G.name === "redblack";
    ath({ p: .93 + .04 * Math.sin(u * 2.2), glow: { lats: [G.good, .75 + .25 * Math.sin(T * 5)], core: [G.good, .45] },
      cam: { az: lerp(-.25, .45, easeInOut(prog(t0, TL.dur))), el: .1, dist: lerp(10.2, 9.4, easeOut(prog(t0, t0 + 1))), look: V3(0, 1.42, 0) } });
    return `<div class="abs" style="left:0;right:0;top:1110px;text-align:center;z-index:30;${appear(t0 + .1)}"><div style="${G.title};font-size:${R ? 120 : 92}px;color:${G.ink};line-height:1">${R ? "DR MAK FITNESS" : "Dr Mak Fitness"}</div>
        <div style="font:800 42px Inter;color:${G.acc};margin-top:14px">@drmakfitness</div></div>`
      + `<div class="abs" style="left:0;right:0;top:1330px;text-align:center;z-index:30;${appear(t0 + .3)}"><span style="display:inline-block;transform:scale(${press});padding:26px 70px;border-radius:999px;font:900 52px Inter;color:#fff;background:${done ? "#2A2A2E" : G.acc};box-shadow:${done ? "none" : "0 0 50px " + G.acc + "aa"}">${done ? "✓ Subscribed" : "▶ Subscribe"}</span></div>`; },
};

// ---------------- frame ----------------
function overlay(t) {
  T = t;
  const k = sceneAt(t), sc = SCENES[k], t0 = TL.cues[sc.id], u = t - t0;
  let body = BODY[sc.id](t0) + head(sc, t0) + (sc.n ? dots(sc.n, sc.bad) : "");
  if (k > 0 && u < .5) {
    const p = easeOut(clamp(u / .35));
    if (G.name === "porcelain") body = `<div class="abs" style="inset:0;transform:translateX(${(1 - p) * 120}px) scale(${lerp(1.04, 1, p)});opacity:${clamp(u / .18)}">${body}</div>`;
    else { const kk = Math.exp(-u * 8), sh = sc.bad ? Math.sin(u * 90) * 14 * kk : 0;
      body = `<div class="abs" style="inset:0;transform:scale(${1 + .07 * kk}) translateX(${sh}px)">${body}</div>`; }
  }
  if (sc.id === "m5" && t > cue("dhadaam")) { const q = Math.exp(-(t - cue("dhadaam")) * 9); body = `<div class="abs" style="inset:0;transform:translate(${Math.sin(t * 97) * 22 * q}px,${Math.cos(t * 83) * 18 * q}px)">${body}</div>`; }
  let h = body + captions();
  if (G.name === "redblack" && k > 0 && u < .22) { const y = 1920 - 2400 * easeInOut(u / .22);
    h += `<div class="abs" style="left:-120px;right:-120px;top:${y}px;height:200px;background:${G.acc};transform:skewY(-9deg);box-shadow:0 0 90px ${G.acc};z-index:55"></div>`; }
  h += `<div class="abs" style="left:0;top:0;height:9px;width:${1080 * t / TL.dur}px;background:${G.acc};z-index:58"></div>`;
  if (sc.id !== "hook" && sc.id !== "cta") h += `<div class="abs" style="left:60px;top:150px;font:800 30px Inter;color:${G.sub};z-index:58"><span style="color:${G.acc}">●</span> @drmakfitness</div>`;
  return h + finish();
}
window.setShort = async (tl, grade) => {
  TL = tl; G = THEMES[grade];
  document.body.style.background = G.bg;
  const c = document.createElement("canvas"); c.width = c.height = 300; const x = c.getContext("2d"), d = x.createImageData(300, 300);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); GRAIN = c.toDataURL();
  await loadAnatomy();
  build3D();
  return TL.dur;
};
window.renderAt = t => {
  T = t;
  const has3D = solve3D(t); T = t;
  document.getElementById("bg").innerHTML = background();
  let h = overlay(t);
  // loop seam: the hook's title fades in over the last 0.3 s while the 3D pose eases into frame 0
  if (t > TL.dur - .3) { const a = prog(TL.dur - .3, TL.dur); SKIP3D = true; h += `<div class="abs" style="inset:0;opacity:${a};z-index:90">${overlay(0.0001)}</div>`; SKIP3D = false; T = t; }
  document.getElementById("fg").innerHTML = h;
  // the 3D athlete takes over after the photo intro
  const id = SCENES[sceneAt(t)].id, show = id !== "hook";
  document.getElementById("gl").style.visibility = show ? "visible" : "hidden";
  document.getElementById("bloom").style.visibility = show ? "visible" : "hidden";
  if (show) { R3.renderer.render(R3.scene, R3.cam); bloom(); }
  document.getElementById("grade").innerHTML = grade(show);
};
</script>
