<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Refined "5 pull-up mistakes" short, 1080x1920. A procedural 3D athlete (three.js) does the
     reps; the motion graphics (titles, stamps, meters, arrows pinned to projected joints,
     captions) sit on top. Two grades share one timeline: porcelain (the launch-film look) and
     redblack (the channel's dark red look). Driven from render.mjs: setShort(timeline, grade)
     then renderAt(t) per frame. -->
<style>
  @font-face { font-family: Anton; src: url(__ASSETS__anton.woff2); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; }
  #bg, #fg { position: absolute; inset: 0; overflow: hidden; }
  #gl, #bloom { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #grade { position: absolute; inset: 0; pointer-events: none; }
</style>
<script src="__ASSETS__three.min.js"></script>
<script src="__RENDER__anatomy3d.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <!-- photo grades: luminance -> tone curve per channel -->
  <filter id="duoP" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/><feComponentTransfer>
    <feFuncR type="table" tableValues="0.09 0.55 0.97"/><feFuncG type="table" tableValues="0.08 0.52 0.94"/><feFuncB type="table" tableValues="0.08 0.48 0.89"/></feComponentTransfer></filter>
  <filter id="duoR" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/><feComponentTransfer>
    <feFuncR type="table" tableValues="0 0.42 0.86 1"/><feFuncG type="table" tableValues="0 0.02 0.36 0.86"/><feFuncB type="table" tableValues="0 0.03 0.32 0.8"/></feComponentTransfer></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</svg>
<div id="bg"></div><canvas id="gl" width="1080" height="1920"></canvas><canvas id="bloom" width="540" height="960"></canvas><div id="grade"></div><div id="fg"></div>
<script>
let T = 0, TL = null, G = null, GRAIN = "";
const ASSET = "__ASSETS__";
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (a, b) => clamp((T - a) / (b - a));
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const back = p => { const c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const on = t0 => T >= t0;
const cue = k => TL.cues[k];
const rep = (u, period, lo = 0, hi = 1) => lerp(lo, hi, .5 - .5 * Math.cos(2 * Math.PI * u / period));
// fade/slide/scale in from t0 (and optionally out at `until`)
function appear(t0, o = {}) {
  const d = o.dur ?? .4, p = prog(t0, t0 + d), e = back(p);
  let op = clamp(p * 2.5);
  if (o.until !== undefined) op *= 1 - prog(o.until - .15, o.until);
  const blur = G.name === "porcelain" ? (1 - easeOut(p)) * 14 : 0;
  return `opacity:${op};transform:translateY(${(1 - e) * (o.dy ?? 40)}px) scale(${lerp(o.scale ?? .9, 1, e)});filter:blur(${blur}px)`;
}

const THEMES = {
  porcelain: {
    name: "porcelain", bg: "#F4F0E8", ink: "#121212", sub: "#77736C", acc: "#E0262B", hl: "#E0262B", good: "#1F9D55",
    title: `font-family:'Inter Display';font-weight:800;letter-spacing:-.045em`, titleSize: 96, upper: false,
    cap: `font-family:'Inter Display';font-weight:800;letter-spacing:-.03em`, capSize: 66,
    card: "background:rgba(255,255,255,.72);box-shadow:0 30px 60px -28px rgba(40,30,20,.35),0 0 0 1px rgba(0,0,0,.04) inset;backdrop-filter:blur(20px)",
  },
  redblack: {
    name: "redblack", bg: "#050506", ink: "#FFFFFF", sub: "#C9B3B3", acc: "#FF1F2D", hl: "#FFD21E", good: "#2EE86A",
    title: `font-family:Anton;letter-spacing:.01em`, titleSize: 138, upper: true,
    cap: `font-family:Anton;letter-spacing:.02em`, capSize: 92,
    card: "background:rgba(24,4,6,.78);box-shadow:0 0 0 3px rgba(255,31,45,.55) inset,0 0 60px rgba(255,31,45,.35)",
  },
};

// ---------------- scene plan ----------------
const SCENES = [
  { id: "hook" }, { id: "promise", title: "5 MISTAKES" },
  { id: "m1", n: 1, bad: true, title: "SHRUGGING" }, { id: "f1", n: 1, title: "BLADES DOWN + BACK" },
  { id: "m2", n: 2, bad: true, title: "ARMS ONLY" }, { id: "f2", n: 2, title: "ELBOWS → RIBS" },
  { id: "m3", n: 3, bad: true, title: "LEG SWING" }, { id: "f3", n: 3, title: "CORE TIGHT" },
  { id: "m4", n: 4, bad: true, title: "HALF REPS" }, { id: "f4", n: 4, title: "FULL RANGE" },
  { id: "m5", n: 5, bad: true, title: "DROPPING" }, { id: "f5", n: 5, title: "3–5 SEC DOWN" },
  { id: "recap", title: "SAVE THIS" }, { id: "cta" },
];
const sceneAt = t => { let k = 0; SCENES.forEach((s, i) => { if (t >= TL.cues[s.id] - .001) k = i; }); return k; };

// Scenes describe the athlete with ath(st). The pose is solved once per frame, before the graphics are
// built (they pin to projected joints): a "collect" pass gathers each scene's st, and across a cut the
// previous scene's pose and camera blend into the new one so the whole short plays as one take.
let SKIP3D = false, COLLECT = null;
function ath(st) { if (COLLECT) COLLECT.st = st; return ""; }
function stateAt(k, t) {
  const sc = SCENES[k]; if (sc.id === "hook") return null;
  const keepT = T; T = t; COLLECT = {}; BODY[sc.id](TL.cues[sc.id]); const st = COLLECT.st; COLLECT = null; T = keepT;
  return st;
}
const isV = v => v && v.isVector3;
function mix(a, b, k) {
  if (a === undefined) return b; if (b === undefined) return a;
  if (typeof a === "number" && typeof b === "number") return lerp(a, b, k);
  if (isV(a) && isV(b)) return a.clone().lerp(b, k);
  if (Array.isArray(a) && Array.isArray(b)) return [k < .5 ? a[0] : b[0], lerp(a[1], b[1], k)];
  if (typeof a === "object" && typeof b === "object") { const o = {}; for (const key of new Set([...Object.keys(a), ...Object.keys(b)])) o[key] = mix(a[key], b[key], k); return o; }
  return k < .5 ? a : b;
}
// glow entries missing on one side fade from/to zero
function withZeros(a, b) { for (const g of Object.keys(b.glow ?? {})) { a.glow = a.glow ?? {}; a.glow[g] = a.glow[g] ?? [b.glow[g][0], 0]; } }
function solve3D(t) {
  const k = sceneAt(t), cur = stateAt(k, t); if (!cur) return false;
  const u = t - TL.cues[SCENES[k].id], BL = .55;
  let st = cur;
  if (u < BL && k > 1) {
    const prev = stateAt(k - 1, t);
    if (prev) { const A = { ...prev, cam: { az: .32, el: .06, dist: 6.6, fov: 28, look: V3(0, 1.63, 0), ...prev.cam } }, B = { ...cur, cam: { az: .32, el: .06, dist: 6.6, fov: 28, look: V3(0, 1.63, 0), ...cur.cam } };
      withZeros(A, B); withZeros(B, A); st = mix(A, B, easeInOut(u / BL)); }
  }
  pose(st); return true;
}

// ---------------- backgrounds ----------------
function background() {
  if (G.name === "porcelain")
    return `<div class="abs" style="inset:0;background:radial-gradient(120% 70% at 50% 38%,#FBF8F2 0%,#F4F0E8 55%,#ECE6DA 100%)"></div>`;
  const fl = .85 + .15 * Math.sin(T * 7.3) * Math.sin(T * 3.1);
  const tubes = [120, 300, 780, 960].map((x, i) => `<div class="abs" style="left:${x}px;top:-40px;width:${i % 3 ? 10 : 14}px;height:2000px;background:linear-gradient(#ff2a3a00,#ff2a3a ${30 + i * 8}%,#ff2a3a00);opacity:${(.16 + .07 * Math.sin(T * 2 + i)) * fl};filter:blur(3px);box-shadow:0 0 60px 18px rgba(255,20,40,.22)"></div>`).join("");
  return `<div class="abs" style="inset:0;background:radial-gradient(90% 55% at 50% 42%,#3B0308 0%,#14020360 45%,#050506 80%)"></div>${tubes}
    <div class="abs" style="inset:0;background:radial-gradient(70% 45% at 50% 105%,rgba(160,0,12,.55),transparent 70%)"></div>`;
}
// ---------------- colour grade ----------------
// bloom: the 3D frame, thresholded and blurred at half res, screened back on top (muscle glow, rim light)
function bloom() {
  const c = document.getElementById("bloom"), x = c.getContext("2d"), R = G.name === "redblack";
  x.clearRect(0, 0, 540, 960);
  x.filter = R ? "brightness(.85) contrast(2.4) saturate(1.4) blur(14px)" : "brightness(.95) contrast(1.8) saturate(1.3) blur(16px)";
  x.drawImage(document.getElementById("gl"), 0, 0, 540, 960);
  c.style.cssText = `mix-blend-mode:screen;opacity:${R ? .6 : .22}`;
}
// grade layers over the background + 3D (not over the graphics): split tone, contrast, halation
function grade(show3d) {
  const gl = document.getElementById("gl");
  if (G.name === "redblack") {
    gl.style.filter = "contrast(1.14) saturate(1.18) brightness(1.03)";
    return `<div class="abs" style="inset:0;background:linear-gradient(180deg,rgba(255,40,40,.10),rgba(120,0,10,.18) 60%,rgba(10,0,2,.35));mix-blend-mode:soft-light"></div>
      <div class="abs" style="inset:0;background:radial-gradient(60% 35% at 50% 34%,rgba(255,60,50,.16),transparent 70%);mix-blend-mode:screen"></div>
      <div class="abs" style="inset:0;background:rgba(40,0,6,.18);mix-blend-mode:multiply"></div>`;
  }
  gl.style.filter = "contrast(1.05) saturate(.96) sepia(.06) brightness(1.02)";
  return `<div class="abs" style="inset:0;background:linear-gradient(180deg,rgba(255,236,214,.22),rgba(255,226,200,.08) 55%,rgba(196,170,140,.18));mix-blend-mode:soft-light"></div>
    <div class="abs" style="inset:0;background:radial-gradient(80% 55% at 50% 40%,transparent 60%,rgba(120,95,70,.16) 100%);mix-blend-mode:multiply"></div>`;
}
function finish() {
  const ox = Math.floor(T * 30 * 97) % 300, oy = Math.floor(T * 30 * 53) % 300;
  if (G.name === "porcelain") return `<div class="abs" style="inset:-300px;background-image:url(${GRAIN});background-position:${ox}px ${oy}px;opacity:.045;mix-blend-mode:multiply;z-index:61"></div>`;
  return `<div class="abs" style="inset:0;background:radial-gradient(75% 60% at 50% 45%,transparent 50%,rgba(0,0,0,.75) 100%);z-index:60"></div>
    <div class="abs" style="inset:-300px;background-image:url(${GRAIN});background-position:${ox}px ${oy}px;opacity:.10;mix-blend-mode:screen;z-index:61"></div>`;
}

// ---------------- motion-graphics chrome ----------------
function arrow(x1, y1, x2, y2, p, col, w = 14) {
  const x = lerp(x1, x2, p), y = lerp(y1, y2, p), a = Math.atan2(y2 - y1, x2 - x1), h = 34;
  if (p <= 0) return "";
  return `<line x1="${x1}" y1="${y1}" x2="${x}" y2="${y}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>
    <path d="M${x + Math.cos(a) * 8} ${y + Math.sin(a) * 8} L${x - h * Math.cos(a - .5)} ${y - h * Math.sin(a - .5)} L${x - h * Math.cos(a + .5)} ${y - h * Math.sin(a + .5)} Z" fill="${col}"/>`;
}
const svg = inner => `<svg class="abs" style="inset:0;overflow:visible;z-index:20" width="1080" height="1920">${inner}</svg>`;
function head(sc, t0) {
  if (!sc.title) return "";
  const s = G.titleSize * (sc.title.length > 14 ? .78 : 1), col = sc.bad ? G.acc : sc.n ? G.good : G.ink;
  const tag = sc.n ? `<div class="abs" style="left:0;right:0;top:300px;text-align:center;${appear(t0, { dy: 20 })}">
      <span style="display:inline-block;padding:10px 26px;border-radius:999px;font:800 30px Inter;letter-spacing:.14em;color:${sc.bad || G.name === "porcelain" ? "#fff" : "#04140a"};background:${col}">${sc.bad ? "MISTAKE " + sc.n : "✓ FIX " + sc.n}</span></div>` : "";
  return `${tag}<div class="abs" style="left:40px;right:40px;top:370px;text-align:center;font-size:${s}px;line-height:1;color:${G.ink};${G.title};${appear(t0 + .06, { dy: 50 })}">${sc.title}</div>`;
}
function dots(n, bad) {
  return `<div class="abs" style="left:0;right:0;top:240px;display:flex;gap:14px;justify-content:center">${[1, 2, 3, 4, 5].map(i =>
    `<div style="width:${i === n ? 70 : 34}px;height:12px;border-radius:6px;background:${i < n ? G.good : i === n ? (bad ? G.acc : G.good) : G.name === "porcelain" ? "rgba(0,0,0,.14)" : "rgba(255,255,255,.2)"}"></div>`).join("")}</div>`;
}
function stamp(ok, t0, x = 850, y = 1000) {
  if (T < t0) return "";
  const p = prog(t0, t0 + .3), s = 1 + 1.3 * Math.exp(-(T - t0) * 11);
  return `<div class="abs" style="left:${x}px;top:${y}px;width:160px;height:160px;border-radius:50%;background:${ok ? G.good : G.acc};color:#fff;font:900 100px/160px Inter;text-align:center;opacity:${clamp(p * 3)};transform:scale(${s}) rotate(${ok ? 0 : -8}deg);box-shadow:0 0 50px ${ok ? G.good : G.acc}88;z-index:30">${ok ? "✓" : "✕"}</div>`;
}
function meter(label, v, x, y, col) {
  return `<div class="abs" style="left:${x}px;top:${y}px;width:150px;height:420px;border-radius:30px;${G.card};z-index:25">
    <div class="abs" style="left:52px;top:28px;width:46px;height:300px;border-radius:23px;background:${G.name === "porcelain" ? "rgba(0,0,0,.08)" : "rgba(255,255,255,.12)"};overflow:hidden">
      <div class="abs" style="left:0;right:0;bottom:0;height:${300 * clamp(v)}px;border-radius:23px;background:${col};box-shadow:0 0 30px ${col}"></div></div>
    <div class="abs" style="left:0;right:0;top:340px;text-align:center;font:900 44px Inter;color:${G.ink}">${Math.round(100 * clamp(v))}%</div>
    <div class="abs" style="left:0;right:0;top:-46px;text-align:center;font:800 26px Inter;letter-spacing:.16em;color:${G.sub}">${label}</div></div>`;
}
function label(text, t0, col, top = 1200) {
  return `<div class="abs" style="left:0;right:0;top:${top}px;text-align:center;z-index:30;${appear(t0, { dy: 30 })}"><span style="display:inline-block;padding:14px 34px;border-radius:999px;font:900 40px Inter;letter-spacing:.08em;color:#fff;background:${col};box-shadow:0 10px 40px ${col}66">${text}</span></div>`;
}
// a small callout pinned to a body point: ring + leader line + pill
function pin(pt, text, col, t0, side = 1) {
  if (T < t0) return "";
  const [x, y] = proj(pt), p = easeOut(prog(t0, t0 + .35));
  if (side > 0 && x + 190 + 420 > 1060) side = -1; else if (side < 0 && x - 190 - 420 < 20) side = 1;
  const lx = x + side * 190 * p, ly = y - 70 * p;
  return svg(`<circle cx="${x}" cy="${y}" r="${18 + 10 * Math.sin(T * 8)}" fill="none" stroke="${col}" stroke-width="5" opacity="${p}"/>
      <line x1="${x}" y1="${y}" x2="${lx}" y2="${ly}" stroke="${col}" stroke-width="4" opacity="${p}"/>`)
    + `<div class="abs" style="left:${side > 0 ? lx + 8 : lx - 408}px;top:${ly - 26}px;width:400px;text-align:${side > 0 ? "left" : "right"};z-index:22;opacity:${p}">
      <span style="display:inline-block;padding:8px 18px;border-radius:12px;font:900 30px Inter;letter-spacing:.06em;color:#fff;background:${col}">${text}</span></div>`;
}
function captions() {
  const W = TL.words; let i = W.findIndex(w => T >= w.s && T < w.e + .25);
  if (i < 0 || T >= cue("cta") || T < cue("promise")) return "";
  const lineOf = k => TL.lines.filter(s => W[k].s >= s - .001).length;
  let a = i; while (a > 0 && lineOf(a - 1) === lineOf(i) && i - a < 2 && !(W[a - 1].w.match(/[:,.?]$/))) a--;
  const st = a; let b = st; while (b + 1 < W.length && b - st < 2 && lineOf(b + 1) === lineOf(st) && !W[b].w.match(/[:,.?]$/)) b++;
  if (i > b) return "";
  const words = W.slice(st, b + 1), c0 = W[st].s;
  return `<div class="abs" style="left:60px;right:60px;top:1335px;display:flex;flex-wrap:wrap;justify-content:center;gap:0 22px;z-index:50">${words.map((w, k) => {
    const cur = st + k === i, said = st + k <= i, txt = G.upper ? w.w.toUpperCase() : w.w;
    const col = cur ? G.hl : w.hl ? G.acc : G.ink, sc = cur ? 1.08 : 1;
    const stroke = G.name === "redblack" ? "-webkit-text-stroke:3px #000;text-shadow:0 6px 0 #000,0 0 30px rgba(0,0,0,.8)" : "text-shadow:0 2px 18px rgba(244,240,232,.9)";
    return `<span style="display:inline-block;${G.cap};font-size:${G.capSize}px;line-height:1.15;color:${col};opacity:${said ? 1 : .35};transform:scale(${sc});${stroke};${appear(c0 + k * .04, { dy: 20, dur: .25 })}">${txt.replace(/[,.:;]$/, "")}</span>`;
  }).join("")}</div>`;
}

// ---------------- the owner's photos: intro and outro only ----------------
// cut-outs (rembg) graded to match: back.png for the hook, side.png for the follow card
function hero(file, o) {
  const R = G.name === "redblack", w = o.w, h = o.h, x = o.x ?? 540 - w / 2, y = o.y, z = o.zoom ?? 1;
  const glow = R ? `<div class="abs" style="left:${x - 200}px;top:${y + h * .1}px;width:${w + 400}px;height:${h * .8}px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,30,45,.6),transparent);filter:blur(30px)"></div>`
    : `<div class="abs" style="left:${540 - 420}px;top:${y + h * .05}px;width:840px;height:840px;border-radius:50%;background:#fff;opacity:.6"></div>`;
  return `${glow}<img src="${ASSET}${file}" style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;object-fit:contain;transform:scale(${z}) translateX(${o.shift ?? 0}px);transform-origin:50% 30%;
    filter:url(#${R ? "duoR" : "duoP"}) contrast(1.08);-webkit-mask-image:linear-gradient(#000 ${o.fade ?? 78}%,transparent 98%)">`;
}

// ---------------- scenes ----------------
// camera presets: the default frames the bar at ~y 650 and the feet above the captions
const camPush = (t0, o = {}) => ({ az: (o.az ?? .32) + .04 * (T - t0), el: o.el ?? .06, dist: lerp(o.from ?? 7.3, o.dist ?? 6.6, easeOut(prog(t0, t0 + .7))), look: o.look, fov: o.fov, shake: o.shake });
const GOOD = () => G.good, BAD = () => G.acc;
const BODY = {
  hook: () => {
    const R = G.name === "redblack", sh0 = T < .3 ? Math.sin(T * 120) * 10 * (1 - T / .3) : 0;
    const photo = hero("back.png", { w: 760, h: 1298, y: 260, zoom: 1.04 + .05 * clamp(T / 1.1), shift: sh0, fade: 70 });
    const sh = T < .3 ? Math.sin(T * 120) * 10 * (1 - T / .3) : 0;
    const words = R
      ? `<div style="font-size:150px;color:#fff">STOP DOING</div><div style="font-size:190px;color:${G.hl};margin-top:-6px">PULL-UPS</div>
         <div style="display:inline-block;margin-top:4px;padding:0 30px;background:${G.acc};color:#fff;font-size:180px;transform:rotate(-3deg);box-shadow:0 0 70px ${G.acc}">WRONG</div>`
      : `<div style="font-size:110px;color:${G.ink}">Stop doing</div><div style="font-size:150px;color:${G.ink};margin-top:6px">pull-ups</div>
         <div style="display:inline-block;margin-top:14px;padding:6px 40px 16px;border-radius:999px;background:${G.acc};color:#fff;font-size:120px">wrong.</div>`;
    return photo + `<div class="abs" style="left:0;right:0;top:${R ? 1180 : 1230}px;text-align:center;line-height:.95;z-index:30;${G.title};transform:translateX(${sh}px) scale(${1 + .25 * Math.exp(-T * 9)})">${words}</div>`;
  },
  promise: t0 => {
    ath({ p: .03 + .02 * Math.sin(T * 3), glow: { lats: [G.acc, on(cue("five")) ? 0 : .3 + .2 * Math.sin(T * 14)] }, cam: camPush(t0, { az: .1, from: 7.5, dist: 7.0 }) });
    const v = on(cue("five")) ? 0 : .06 + .05 * Math.sin(T * 20);
    const slots = [1, 2, 3, 4, 5].map(i => `<div style="width:150px;height:150px;border-radius:30px;${G.card};display:flex;align-items:center;justify-content:center;font-size:90px;color:${G.acc};${G.title};${appear(cue("five") + (i - 1) * .1, { dy: 60, scale: .5 })}">${i}</div>`).join("");
    return `<div class="abs" style="z-index:25;${appear(cue("lats0"), { dy: 0, scale: .7 })}">${meter("LATS", v, 880, 760, G.acc)}</div>`
      + pin(R3.joints.latR, "LATS: ASLEEP", G.acc, cue("lats0") + .2, -1)
      + (on(cue("five")) ? `<div class="abs" style="left:0;right:0;top:1120px;display:flex;gap:22px;justify-content:center;z-index:30">${slots}</div>` : "");
  },
  m1: t0 => { const u = T - t0;
    ath({ p: rep(u, 1.5, .05, .75), shrug: .55 + .45 * Math.sin(u * 4.2), glow: { traps: [G.acc, .7 + .3 * Math.sin(u * 8)] }, cam: camPush(t0, { az: .5, el: .1, look: V3(0, 1.85, 0), dist: 5.9, from: 6.6 }) });
    const J = R3.joints, up = easeOut(prog(t0 + .3, t0 + .8)), [lx, ly] = proj(J.shL), [rx, ry] = proj(J.shR);
    return svg(arrow(lx - 30, ly + 10, lx - 30, ly - 130, up, G.acc, 14) + arrow(rx + 30, ry + 10, rx + 30, ry - 130, up, G.acc, 14))
      + pin(J.trap, "TRAPS TAKE OVER", G.acc, t0 + .9, 1) + stamp(false, t0 + .5); },
  f1: t0 => { const u = T - t0, set = prog(cue("neeche") - .2, cue("peeche") + .3);
    ath({ p: u < 1.2 ? .02 + .1 * easeOut(prog(cue("neeche") - .1, cue("neeche") + .4)) : rep(u - 1.2, 2.2, .1, .95), glow: { lats: [G.good, set * (.75 + .25 * Math.sin(T * 6))] }, cam: camPush(t0, { az: .18, el: .14, look: V3(0, 1.8, 0), dist: 5.8, from: 6.4 }) });
    const J = R3.joints, q = easeOut(prog(cue("neeche") - .1, cue("neeche") + .5)), [ax, ay] = proj(J.latL), [bx, by] = proj(J.latR);
    return svg(arrow(ax + 10, ay - 120, ax + 25, ay + 20, q, G.good, 14) + arrow(bx - 10, by - 120, bx - 25, by + 20, q, G.good, 14))
      + `<div class="abs" style="z-index:25;${appear(cue("peeche"), { scale: .7, dy: 0 })}">${meter("LATS", set * .92, 40, 820, G.good)}</div>` + stamp(true, t0 + .3); },
  m2: t0 => { const u = T - t0;
    ath({ p: rep(u, 1.3, .1, .85), lean: .05, glow: { arms: [G.acc, .85] }, cam: camPush(t0, { az: .75, el: .05 }) });
    return pin(R3.joints.elR, "BICEPS DOING IT ALL", G.acc, t0 + .5, -1)
      + `<div class="abs" style="z-index:25;${appear(cue("arms"), { scale: .7, dy: 0 })}">${meter("BICEPS", .95, 40, 820, G.acc)}</div>`
      + `<div class="abs" style="z-index:25;${appear(cue("arms") + .3, { scale: .7, dy: 0 })}">${meter("LATS", .2, 890, 820, G.sub)}</div>` + stamp(false, t0 + .4, 850, 1290 - 160); },
  f2: t0 => { const u = T - t0, q = easeInOut(prog(t0 + .2, cue("drive") + .2));
    ath({ p: rep(u, 2.1, .1, .95), glow: { lats: [G.good, prog(cue("drive") - .3, cue("drive") + .5) * (.75 + .25 * Math.sin(T * 6))] }, cam: camPush(t0, { az: .22, el: .12, look: V3(0, 1.8, 0), dist: 5.9, from: 6.6 }) });
    const J = R3.joints, path = (e, r, s) => { const [ex, ey] = proj(e), [rx, ry] = proj(r);
      return `<path d="M${ex} ${ey} Q${ex + s * 90} ${(ey + ry) / 2} ${rx} ${ry}" fill="none" stroke="${G.good}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${800 * q} 800"/>`
        + (q > .95 ? arrow(rx + s * 50, ry - 50, rx, ry, 1, G.good, 14) : ""); };
    return svg(path(J.elL, J.latLb, -1) + path(J.elR, J.latRb, 1)) + label("PULL WITH YOUR BACK", cue("drive"), G.good) + stamp(true, t0 + .3); },
  m3: t0 => { const u = T - t0, sw = Math.sin(u * 4.6);
    ath({ p: rep(u, 1.36, .1, .9), lean: .32 * sw, legSwing: .55 * sw, knee: .6, cam: camPush(t0, { az: 1.15, el: .04, dist: 7.5 }) });
    return pin(R3.joints.foot, "MOMENTUM ≠ MUSCLE", G.acc, cue("swing") + .2, -1) + stamp(false, t0 + .4); },
  f3: t0 => { const u = T - t0;
    ath({ p: rep(u, 1.9, .05, .95), lean: -.04, legSwing: .08, knee: .05, glow: { core: [G.good, prog(t0 + .2, t0 + .6)], lats: [G.good, .5] }, cam: camPush(t0, { az: 1.0, el: .04, dist: 7.5 }) });
    const [x, y] = proj(R3.joints.waist), s = lerp(1.6, 1, easeOut(prog(t0 + .2, t0 + .6)));
    return svg(`<g transform="translate(${x} ${y}) scale(${s})" opacity="${prog(t0 + .2, t0 + .4)}" fill="none" stroke="${G.good}" stroke-width="10" stroke-linecap="round">
      <path d="M-80 -90 h-26 v52 M80 -90 h26 v52 M-80 90 h-26 v-52 M80 90 h26 v-52"/></g>`) + label("NO SWING", cue("still"), G.good) + stamp(true, t0 + .3); },
  m4: t0 => { const u = T - t0;
    ath({ p: rep(u, .9, .3, .62), cam: camPush(t0, { az: .45, el: .02 }) });
    const [ax, ay] = proj(V3(-1.2, BAR_Y + .02, 0)), [bx, by] = proj(V3(1.2, BAR_Y + .02, 0));
    return svg(`<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="${G.acc}" stroke-width="6" stroke-dasharray="24 14"/>
      <text x="90" y="${ay - 22}" font-family="Inter" font-weight="800" font-size="34" fill="${G.acc}">CHIN NEVER GETS HERE</text>`) + stamp(false, t0 + .3); },
  f4: t0 => { const u = T - t0, p = rep(u, 2.2, 0, 1);
    ath({ p, glow: { lats: [G.good, .4 + .5 * p] }, cam: camPush(t0, { az: .45, el: .02 }) });
    const [ax, ay] = proj(V3(-1.2, BAR_Y + .02, 0)), [bx, by] = proj(V3(1.2, BAR_Y + .02, 0));
    const [cx, cy] = proj(V3(-1.2, BAR_Y - .58, 0)), [dx, dy] = proj(V3(1.2, BAR_Y - .58, 0));
    return svg(`<g opacity="${prog(cue("chin") - .2, cue("chin"))}"><text x="90" y="${ay - 22}" font-family="Inter" font-weight="800" font-size="34" fill="${G.good}">CHIN OVER BAR ✓</text></g>
      <g opacity="${prog(cue("deadhang") - .2, cue("deadhang"))}"><line x1="${cx}" y1="${cy}" x2="${dx}" y2="${dy}" stroke="${G.good}" stroke-width="5" stroke-dasharray="20 14"/>
      <text x="90" y="${cy + 50}" font-family="Inter" font-weight="800" font-size="34" fill="${G.good}">FULL DEAD HANG</text></g>`)
      + meter("RANGE", p, 890, 820, G.good) + stamp(true, t0 + .3, 850, 1290 - 160); },
  m5: t0 => { const u = T - t0, d = cue("dhadaam") - t0;
    const p = u < d - .6 ? rep(u, 1.2, .2, 1) : u < d ? lerp(rep(d - .6, 1.2, .2, 1), 1, prog(t0 + d - .6, t0 + d - .3)) : Math.max(0, 1 - (u - d) / .14) + (u > d + .14 ? .05 * Math.exp(-(u - d - .14) * 8) * Math.abs(Math.sin((u - d) * 30)) : 0);
    const hit = u > d ? Math.exp(-(u - d) * 7) : 0;
    ath({ p, knee: .35 + .3 * hit, glow: { arms: [G.acc, hit] }, cam: { ...camPush(t0, { az: .55, el: .02 }), shake: .05 * hit } });
    const [x, y] = proj(R3.joints.elR);
    return (u > d ? svg(`<circle cx="${x}" cy="${y}" r="${60 + (u - d) * 600}" fill="none" stroke="${G.acc}" stroke-width="10" opacity="${clamp(1 - (u - d) * 2)}"/>`)
      + pin(R3.joints.shR, "SHOULDER STRAIN", G.acc, cue("dhadaam") + .25, 1)
      + `<div class="abs" style="left:0;right:0;top:1130px;text-align:center;z-index:30;${G.title};font-size:120px;color:${G.acc};transform:scale(${1 + .8 * Math.exp(-(u - d) * 10)}) rotate(-6deg)">THUD!</div>` : "")
      + stamp(false, cue("dhadaam"), 850, 820); },
  f5: t0 => { const u = T - t0, top = .7, p = u < top ? lerp(.2, 1, easeInOut(u / top)) : Math.max(0, 1 - (u - top) / 2.4);
    ath({ p, glow: { lats: [G.good, .8] }, cam: camPush(t0, { az: .3 + .3 * prog(t0, t0 + 3), el: .06 }) });
    const n = u < top ? 0 : Math.min(3, 1 + Math.floor((u - top) / .8));
    return (u < top ? "" : `<div class="abs" style="left:70px;top:820px;z-index:30;${G.title};font-size:240px;color:${G.good};transform:scale(${1 + .3 * Math.exp(-((u - top) % .8) * 9)})">${n}</div>
      <div class="abs" style="left:70px;top:1120px;z-index:30;font:800 30px Inter;letter-spacing:.16em;color:${G.sub}">SECONDS</div>`) + stamp(true, t0 + .2); },
  recap: t0 => { const items = ["No shrug", "Elbows to ribs", "No swing", "Full range", "Slow negative"], u = T - t0;
    ath({ p: rep(u, 2.4, .05, .95), glow: { lats: [G.good, .85 + .15 * Math.sin(T * 5)], core: [G.good, .5] }, cam: { az: .35 + .05 * u, el: .06, dist: 8.0, look: V3(-.85, 1.62, -.25) } });
    const step = (cue("check") - t0 - .2) / 5;
    return `<div class="abs" style="left:580px;top:620px;width:450px;border-radius:36px;padding:30px 30px;z-index:30;${G.card};${appear(t0, { dy: 60 })}">${items.map((s, i) => {
        const tk = t0 + .2 + i * step, ok = on(tk);
        return `<div style="display:flex;align-items:center;gap:22px;height:100px;font:800 40px Inter;color:${G.ink}">
          <span style="width:62px;height:62px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:38px;color:#fff;background:${ok ? G.good : "transparent"};border:4px solid ${ok ? G.good : G.sub};transform:scale(${ok ? 1 + .5 * Math.exp(-(T - tk) * 10) : 1})">${ok ? "✓" : ""}</span>${s}</div>`; }).join("")}</div>`
      + `<div class="abs" style="left:590px;top:1200px;z-index:30;${appear(cue("save"), { dy: 30 })};font:900 44px Inter;color:${G.ink}">🔖 Save for pull day</div>`; },
  cta: t0 => { const u = T - t0, click = cue("follow") + .25, done = on(click), press = done && T < click + .15 ? .9 : 1, R = G.name === "redblack";
    ath({ p: .93 + .04 * Math.sin(u * 2.2), glow: { lats: [G.good, .75 + .25 * Math.sin(T * 5)], core: [G.good, .45] },
      cam: { az: lerp(-.25, .45, easeInOut(prog(t0, TL.dur))), el: .1, dist: lerp(10.2, 9.4, easeOut(prog(t0, t0 + 1))), look: V3(0, 1.42, 0) } });
    return `<div class="abs" style="left:0;right:0;top:1110px;text-align:center;z-index:30;${appear(t0 + .1)}"><div style="${G.title};font-size:${R ? 120 : 92}px;color:${G.ink};line-height:1">${R ? "DR MAK FITNESS" : "Dr Mak Fitness"}</div>
        <div style="font:800 42px Inter;color:${G.acc};margin-top:14px">@drmakfitness</div></div>`
      + `<div class="abs" style="left:0;right:0;top:1330px;text-align:center;z-index:30;${appear(t0 + .3)}"><span style="display:inline-block;transform:scale(${press});padding:26px 70px;border-radius:999px;font:900 52px Inter;color:#fff;background:${done ? "#2A2A2E" : G.acc};box-shadow:${done ? "none" : "0 0 50px " + G.acc + "aa"}">${done ? "✓ Subscribed" : "▶ Subscribe"}</span></div>`; },
};

// ---------------- frame ----------------
function overlay(t) {
  T = t;
  const k = sceneAt(t), sc = SCENES[k], t0 = TL.cues[sc.id], u = t - t0;
  let body = BODY[sc.id](t0) + head(sc, t0) + (sc.n ? dots(sc.n, sc.bad) : "");
  if (k > 0 && u < .5) {
    const p = easeOut(clamp(u / .35));
    if (G.name === "porcelain") body = `<div class="abs" style="inset:0;transform:translateX(${(1 - p) * 120}px) scale(${lerp(1.04, 1, p)});opacity:${clamp(u / .18)}">${body}</div>`;
    else { const kk = Math.exp(-u * 8), sh = sc.bad ? Math.sin(u * 90) * 14 * kk : 0;
      body = `<div class="abs" style="inset:0;transform:scale(${1 + .07 * kk}) translateX(${sh}px)">${body}</div>`; }
  }
  if (sc.id === "m5" && t > cue("dhadaam")) { const q = Math.exp(-(t - cue("dhadaam")) * 9); body = `<div class="abs" style="inset:0;transform:translate(${Math.sin(t * 97) * 22 * q}px,${Math.cos(t * 83) * 18 * q}px)">${body}</div>`; }
  let h = body + captions();
  if (G.name === "redblack" && k > 0 && u < .22) { const y = 1920 - 2400 * easeInOut(u / .22);
    h += `<div class="abs" style="left:-120px;right:-120px;top:${y}px;height:200px;background:${G.acc};transform:skewY(-9deg);box-shadow:0 0 90px ${G.acc};z-index:55"></div>`; }
  h += `<div class="abs" style="left:0;top:0;height:9px;width:${1080 * t / TL.dur}px;background:${G.acc};z-index:58"></div>`;
  if (sc.id !== "hook" && sc.id !== "cta") h += `<div class="abs" style="left:60px;top:150px;font:800 30px Inter;color:${G.sub};z-index:58"><span style="color:${G.acc}">●</span> @drmakfitness</div>`;
  return h + finish();
}
window.setShort = async (tl, grade) => {
  TL = tl; G = THEMES[grade];
  document.body.style.background = G.bg;
  const c = document.createElement("canvas"); c.width = c.height = 300; const x = c.getContext("2d"), d = x.createImageData(300, 300);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); GRAIN = c.toDataURL();
  await loadAnatomy();
  build3D();
  return TL.dur;
};
window.renderAt = t => {
  T = t;
  const has3D = solve3D(t); T = t;
  document.getElementById("bg").innerHTML = background();
  let h = overlay(t);
  // loop seam: the hook's title fades in over the last 0.3 s while the 3D pose eases into frame 0
  if (t > TL.dur - .3) { const a = prog(TL.dur - .3, TL.dur); SKIP3D = true; h += `<div class="abs" style="inset:0;opacity:${a};z-index:90">${overlay(0.0001)}</div>`; SKIP3D = false; T = t; }
  document.getElementById("fg").innerHTML = h;
  // the 3D athlete takes over after the photo intro
  const id = SCENES[sceneAt(t)].id, show = id !== "hook";
  document.getElementById("gl").style.visibility = show ? "visible" : "hidden";
  document.getElementById("bloom").style.visibility = show ? "visible" : "hidden";
  if (show) { R3.renderer.render(R3.scene, R3.cam); bloom(); }
  document.getElementById("grade").innerHTML = grade(show);
};
</script>
