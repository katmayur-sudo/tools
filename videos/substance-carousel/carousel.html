<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>F10-F19 Carousel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: #0A0C11; color: #fff; font-family: "Inter", sans-serif; }
  .slide { position: absolute; inset: 0; overflow: hidden; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 60px 60px; }
  .glow { position: absolute; border-radius: 50%; }
  .photo { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: .32; filter: saturate(.9); }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,12,17,.5), rgba(10,12,17,.92)); }
  .d { font-family: "Inter Display", "Inter"; font-weight: 900; letter-spacing: -0.03em; line-height: 1.02; }
  .kicker { font-weight: 800; font-size: 26px; letter-spacing: .2em; text-transform: uppercase; color: #FFD23F; }
  .r { color: #FF4D4F; } .b { color: #4DA3FF; } .y { color: #FFD23F; } .g { color: #3DDC97; }
  .content { position: absolute; left: 70px; right: 70px; top: 90px; bottom: 120px; display: flex; flex-direction: column; justify-content: center; gap: 34px; }
  .card { background: #151821; border-radius: 30px; box-shadow: 0 0 0 2px rgba(255,255,255,.06) inset, 0 30px 60px -30px rgba(0,0,0,.7); }
  .item { display: flex; gap: 24px; align-items: center; font-family: "Inter Display"; font-weight: 800; font-size: 40px; line-height: 1.12; letter-spacing: -0.01em; }
  .dot { flex: none; width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 900; color: #0A0C11; }
  .footer { position: absolute; left: 60px; right: 60px; bottom: 44px; display: flex; justify-content: space-between; font-weight: 800; font-size: 24px; color: rgba(255,255,255,.55); }
  .src { position: absolute; right: 60px; bottom: 86px; font-size: 20px; font-weight: 600; color: rgba(255,255,255,.4); }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const COL = { r: "#FF4D4F", b: "#4DA3FF", y: "#FFD23F", g: "#3DDC97" };
const ICON = {   // simple drawn icons, 200x200 viewBox
  zigzag: c => `<path d="M20 160 L60 60 L100 150 L140 50 L180 140" fill="none" stroke="${c}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="180" cy="140" r="14" fill="${c}"/>`,
  check: c => `<rect x="30" y="20" width="140" height="170" rx="18" fill="none" stroke="${c}" stroke-width="10"/>${[60, 100, 140].map(y => `<path d="M55 ${y} l12 12 l22 -24" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round"/><path d="M105 ${y + 2} h45" stroke="${c}" stroke-width="9" stroke-linecap="round" opacity=".5"/>`).join("")}`,
  fire: c => `<path d="M100 20 C130 70 170 90 160 140 C152 180 118 195 100 195 C70 195 40 175 40 135 C40 100 70 90 75 55 C90 75 95 90 100 20 Z" fill="${c}"/><path d="M100 110 C115 130 130 140 125 165 C120 185 80 185 76 165 C72 145 92 140 100 110 Z" fill="#FFD23F"/>`,
  film: c => `<rect x="20" y="40" width="160" height="120" rx="12" fill="none" stroke="${c}" stroke-width="10"/>${[0, 1, 2].map(i => `<rect x="${35 + i * 50}" y="65" width="40" height="70" rx="6" fill="${i === 1 ? "none" : c}" stroke="${c}" stroke-width="6" ${i === 1 ? 'stroke-dasharray="8 8"' : ""}/>`).join("")}<text x="100" y="112" text-anchor="middle" font-size="40" font-weight="900" fill="${c}">?</text>`,
  pill: c => `<g transform="rotate(-35 100 100)"><rect x="25" y="70" width="150" height="60" rx="30" fill="none" stroke="${c}" stroke-width="10"/><path d="M100 70 v60" stroke="${c}" stroke-width="10"/><rect x="25" y="70" width="75" height="60" rx="30" fill="${c}" opacity=".6"/></g>`,
  face: c => `<circle cx="100" cy="100" r="80" fill="none" stroke="${c}" stroke-width="10"/><circle cx="70" cy="85" r="14" fill="${c}"/><circle cx="130" cy="85" r="14" fill="${c}"/><path d="M68 108 q-4 18 4 24 M132 108 q4 18 -4 24" stroke="#4DA3FF" stroke-width="6" fill="none"/><ellipse cx="100" cy="148" rx="22" ry="14" fill="none" stroke="${c}" stroke-width="8"/>`,
  ant: c => [[60, 70], [120, 110], [80, 150]].map(([x, y]) => `<g transform="translate(${x} ${y})"><ellipse cx="-16" cy="0" rx="10" ry="8" fill="${c}"/><ellipse cx="0" cy="0" rx="9" ry="7" fill="${c}"/><ellipse cx="18" cy="0" rx="14" ry="10" fill="${c}"/>${[-6, 0, 6].map(d => `<path d="M${d} 0 l-8 14 M${d} 0 l-8 -14" stroke="${c}" stroke-width="3"/>`).join("")}</g>`).join(""),
  swirl: c => `<path d="M100 100 m0 -10 a10 10 0 1 1 -10 10 a20 20 0 1 1 20 20 a30 30 0 1 1 -30 -30 a40 40 0 1 1 40 40 a50 50 0 1 1 -50 -50 a60 60 0 1 1 60 60" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round"/>`,
  syringe: c => `<g transform="rotate(-40 100 100)"><rect x="40" y="80" width="100" height="40" rx="6" fill="none" stroke="${c}" stroke-width="10"/><path d="M140 100 h40 M20 80 v40 M20 100 h20" stroke="${c}" stroke-width="10" stroke-linecap="round"/><rect x="45" y="85" width="50" height="30" fill="${c}" opacity=".5"/></g>`,
};
const icon = (n, c, s = 200) => `<svg width="${s}" height="${s}" viewBox="0 0 200 200">${ICON[n](c)}</svg>`;
let D;
const bgPhoto = img => img ? `<div class="photo" style="background-image:url('assets/${img}')"></div><div class="shade"></div>` : "";

const T = {
  cover: s => bgPhoto(s.img).replace('class="photo"', 'class="photo" style="opacity:.6;background-image:url(\'assets/' + s.img + '\')"') + `<div class="content" style="justify-content:flex-end;gap:30px;padding-bottom:40px">
    <div class="kicker">${s.kicker}</div><div class="d" style="font-size:118px">${s.title}</div>
    <div><span class="d" style="display:inline-block;background:#FFD23F;color:#0A0C11;border-radius:18px;padding:10px 28px 14px;font-size:40px">${s.pill}</span></div>${`<div style="display:flex;align-items:center;gap:18px"><div style="width:64px;height:64px;border-radius:50%;background:#FFD23F;color:#0A0C11;display:flex;align-items:center;justify-content:center" class="d"><span style="font-size:30px">MK</span></div><div><div class="d" style="font-size:34px">${D.author}</div><div style="font-size:24px;font-weight:700;color:rgba(255,255,255,.7)">${D.credentials}</div></div></div>`}</div>`,
  stat: s => bgPhoto(s.img) + `<div class="content" style="align-items:flex-start">
    <div class="d y" style="font-size:${s.big.length > 6 ? 130 : 220}px">${s.big}</div>
    <div class="d" style="font-size:58px;font-weight:800;line-height:1.15">${s.line}</div>
    <div style="font-size:34px;font-weight:700;color:rgba(255,255,255,.75)">${s.cta}</div></div>`,
  chips: s => `<div class="content" style="gap:28px"><div class="kicker">${s.kicker}</div><div class="d" style="font-size:84px">${s.title}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">${s.chips.map(([c, n], i) => `<div class="card" style="padding:22px 26px;display:flex;gap:20px;align-items:center;${i === 0 ? "box-shadow:0 0 0 3px #FFD23F inset" : ""}">
      <span class="d y" style="font-size:40px">${c}</span><span class="d" style="font-size:34px;font-weight:800">${n}</span></div>`).join("")}</div>
    <div style="font-size:22px;color:rgba(255,255,255,.5);font-weight:600">${s.note}</div></div>`,
  ladder: s => `<div class="content"><div class="kicker">${s.kicker}</div><div class="d" style="font-size:96px">${s.title}</div>
    <div style="display:flex;flex-direction:column;gap:20px;margin-top:10px">${s.steps.map((t, i) => `<div class="card" style="margin-left:${i * 90}px;padding:30px 36px;display:flex;gap:26px;align-items:center;border-left:14px solid ${["#3DDC97", "#FFD23F", "#FF9F1C", "#FF4D4F"][i]}">
      <span class="d" style="font-size:64px;color:${["#3DDC97", "#FFD23F", "#FF9F1C", "#FF4D4F"][i]}">${i + 1}</span><span class="d" style="font-size:56px">${t}</span></div>`).join("")}</div></div>`,
  list: s => `<div class="content"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:30px">
      <div><div class="kicker">${s.kicker}</div><div class="d" style="font-size:80px;margin-top:20px">${s.title}</div></div>
      <div style="flex:none">${icon(s.icon, COL[s.color], 220)}</div></div>
    <div style="display:flex;flex-direction:column;gap:22px">${s.items.map(t => `<div class="item"><div class="dot" style="background:${COL[s.color]}">✓</div><div>${t}</div></div>`).join("")}</div></div>`,
  timeline: s => {
    let d = ""; for (let x = 0; x <= 100; x += 2) d += `${x ? "L" : "M"}${x * 9.4} ${300 - 260 * Math.exp(-Math.pow((x - 45) / 18, 2))} `;
    return `<div class="content"><div class="kicker">${s.kicker}</div><div class="d" style="font-size:80px">${s.title}</div>
    <svg width="940" height="340" viewBox="0 0 940 340"><path d="${d}" fill="none" stroke="#FF4D4F" stroke-width="10" stroke-linecap="round"/>
      <path d="M0 305 H940" stroke="rgba(255,255,255,.3)" stroke-width="3"/>${["Last drink", "Day 1", "Day 2–3 PEAK", ""].map((t, i) => `<text x="${[10, 220, 423, 720][i]}" y="335" font-size="26" font-weight="800" fill="${i === 2 ? "#FF4D4F" : "rgba(255,255,255,.6)"}">${t}</text>`).join("")}
      <circle cx="423" cy="40" r="16" fill="#FF4D4F"/></svg>
    <div style="display:flex;flex-direction:column;gap:18px">${s.items.map(t => `<div class="item" style="font-size:36px"><div class="dot" style="background:#FF4D4F;color:#fff">!</div><div>${t}</div></div>`).join("")}</div></div>`;
  },
  compare: s => {
    const side = (x, c) => `<div class="card" style="flex:1;padding:34px;border-top:14px solid ${c}"><div class="d" style="font-size:44px;color:${c}">${x.name}</div>
      <div style="display:flex;flex-direction:column;gap:22px;margin-top:28px">${x.items.map(t => `<div class="d" style="font-size:36px;font-weight:800;line-height:1.15">• ${t}</div>`).join("")}</div></div>`;
    return `<div class="content"><div class="kicker">${s.kicker}</div><div class="d" style="font-size:84px">${s.title}</div>
    <div style="display:flex;gap:26px">${side(s.left, COL.r)}${side(s.right, COL.b)}</div>${s.note ? `<div style="font-size:30px;font-weight:700;color:rgba(255,255,255,.7)">${s.note}</div>` : ""}</div>`;
  },
  body: s => `<div class="content" style="gap:20px"><div class="kicker">${s.kicker}</div><div class="d" style="font-size:80px">${s.title}</div>
    <div style="position:relative;height:820px">
      <svg class="abs" style="position:absolute;left:330px;top:0" width="280" height="820" viewBox="0 0 280 820"><g fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.35)" stroke-width="4">
        <circle cx="140" cy="70" r="58"/><path d="M80 140 h120 l30 260 h-40 l-10 -170 v420 h-45 l-15 -250 l-15 250 h-45 v-420 l-10 170 h-40 z"/></g></svg>
      ${s.organs.map(([t, x, y], i) => `<div style="position:absolute;${x < 50 ? "left:0" : "right:0"};top:${y * 7.6}px;width:430px;${x < 50 ? "" : "text-align:right"}">
        <span class="d" style="font-size:28px;font-weight:800;line-height:1.15;display:inline-block;padding:10px 16px;border-radius:14px;background:rgba(255,77,79,.14);box-shadow:0 0 0 2px #FF4D4F inset">${t}</span></div>`).join("")}</div></div>`,
  quiz: s => `<div class="content" style="gap:22px"><div class="kicker">${s.kicker}</div><div class="d" style="font-size:84px">${s.title}</div>
    ${s.qa.map(([q, a]) => `<div class="card" style="padding:24px 30px"><div class="d" style="font-size:38px">Q. ${q}</div><div class="d y" style="font-size:34px;font-weight:800;margin-top:8px">→ ${a}</div></div>`).join("")}</div>`,
  cta: s => `<div class="content" style="align-items:center;text-align:center">
    <svg width="150" height="190" viewBox="0 0 30 38"><path d="M3 2 h24 v34 l-12 -9 l-12 9 z" fill="#FFD23F"/></svg>
    <div class="d" style="font-size:96px">${s.title}</div><div class="d" style="font-size:44px;font-weight:800;color:rgba(255,255,255,.8)">${s.line}</div>
    <div style="margin-top:20px;text-align:left">${`<div style="display:flex;align-items:center;gap:18px"><div style="width:64px;height:64px;border-radius:50%;background:#FFD23F;color:#0A0C11;display:flex;align-items:center;justify-content:center" class="d"><span style="font-size:30px">MK</span></div><div><div class="d" style="font-size:34px">${D.author}</div><div style="font-size:24px;font-weight:700;color:rgba(255,255,255,.7)">${D.credentials}</div></div></div>`}</div>
    <div style="font-size:24px;font-weight:600;color:rgba(255,255,255,.45);max-width:860px;margin-top:30px">Source: Davidson's Principles &amp; Practice of Medicine, 24th ed · ICD-10 sub-codes: WHO · For medical students · Educational, not treatment advice</div></div>`,
};
window.show = (d, i) => {
  D = d; const s = d.slides[i], n = d.slides.length, c = COL[s.color] || "#FF4D4F";
  document.getElementById("stage").innerHTML = `<div class="slide"><div class="grid"></div>
    <div class="glow" style="left:-300px;top:100px;width:1000px;height:1000px;background:radial-gradient(circle, ${c}24, transparent 65%)"></div>
    <div class="glow" style="right:-350px;bottom:-200px;width:1000px;height:1000px;background:radial-gradient(circle, #4DA3FF1c, transparent 65%)"></div>
    ${T[s.type](s)}${s.src ? `<div class="src">Davidson ${s.src}</div>` : ""}
    <div class="footer"><span>${i + 1} / ${n}</span><span>${D.author}</span><span class="y">${i + 1 < n ? "Swipe →" : "Save karo"}</span></div></div>`;
};
</script>
</body>
</html>
