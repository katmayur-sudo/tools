<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Beginner Gym Engine</title>
<style>
  :root {
    --paper: #F3F1EC; --paper2: #E9E6DF; --ink: #121212; --muted: #6B6862;
    --red: #E0262B; --red-soft: #FBE3E2; --card: #FFFFFF; --night: #0E0E10;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
  body { font-family: "Inter", sans-serif; color: var(--ink); }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  .abs { position: absolute; }
  .disp { font-family: "Inter Display", "Inter", sans-serif; letter-spacing: -0.03em; }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(0,0,0,.035) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(0,0,0,.035) 1px, transparent 1px);
    background-size: 64px 64px; }
  .card { background: var(--card); border-radius: 28px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.05); }
  .dark { background: #141416; color: #fff; border-radius: 28px;
    box-shadow: 0 30px 70px -20px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.06) inset; }
  .pill { display: inline-flex; align-items: center; gap: 12px; border-radius: 999px;
    padding: 12px 26px; font-weight: 700; }
  .hl { background: var(--red); color: #fff; border-radius: 10px; padding: 0 12px; }
  .glow { box-shadow: 0 0 0 3px rgba(224,38,43,.9), 0 0 24px rgba(224,38,43,.55); }
  .photo { overflow: hidden; border-radius: 26px; }
  .photo img { position: absolute; width: 100%; height: 100%; object-fit: cover; }
  .gen img { width: 116%; height: 116%; left: -1%; top: -1%; }  /* crops the generator watermark */
  .chip { display: inline-block; padding: 10px 20px; border-radius: 999px; background: #fff;
    border: 2px solid rgba(0,0,0,.08); font-weight: 600; font-size: 26px; margin: 0 10px 10px 0; }
  .label { font-size: 22px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--red); }
  .caption { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; z-index: 50; }
  .caption span.box { display: inline-block; font-family: "Inter Display", "Inter"; font-weight: 800;
    font-size: 46px; letter-spacing: -0.02em; padding: 6px 16px; border-radius: 12px; margin: 0 4px;
    background: #111; color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.14), 0 10px 24px -8px rgba(0,0,0,.4); }
  .caption span.box.r { background: var(--red); }
  .progress { position: absolute; left: 0; top: 0; height: 6px; background: var(--red); z-index: 60; }
  .chapterTag { position: absolute; left: 56px; top: 34px; z-index: 60; font-size: 20px; font-weight: 700;
    letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .chapterTag b { color: var(--red); }
  svg text { font-family: "Inter", sans-serif; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = p => 1 - Math.pow(1 - clamp(p), 3);
const easeInOut = p => { p = clamp(p); return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
function spring(t, d = 0.55) {            // 0 -> 1 with a small overshoot
  if (t <= 0) return 0; if (t >= d * 2) return 1;
  const p = t / d; return 1 - Math.exp(-5 * p) * Math.cos(7 * p);
}
let T = 0;                                  // current absolute time (seconds)
// appear(at): style for an element popping in at absolute time `at`
function appear(at, opts = {}) {
  const dy = opts.dy ?? 40, sc = opts.scale ?? 0.92, dur = opts.dur ?? 0.5;
  const dt = T - at;
  if (dt < 0) return "opacity:0;";
  const s = spring(dt, dur), o = clamp(dt / (dur * 0.6));
  let st = `opacity:${o};transform:translateY(${(1 - s) * dy}px) scale(${lerp(sc, 1, s)});`;
  if (opts.until !== undefined && T > opts.until) {
    const q = clamp((T - opts.until) / 0.3);
    st = `opacity:${1 - q};transform:translateY(${-q * 30}px) scale(${1 - q * 0.04});`;
  }
  return st;
}
const on = at => T >= at;
const prog = (a, b) => clamp((T - a) / (b - a));
const img = (name, gen = true) => gen ? `../assets/img/${name}.jpg` : `../assets/user/${name}.jpg`;
function photo(x, y, w, h, name, opts = {}) {
  const gen = opts.gen ?? true;
  if (gen && TL && TL.images && !TL.images.includes(name)) return opts.fallback ?? "";
  const kb = 1 + 0.06 * prog(opts.kbFrom ?? 0, opts.kbTo ?? 1);
  const filt = opts.filter ?? (gen ? "saturate(.9) contrast(1.02)" : "grayscale(1) contrast(1.08)");
  return `<div class="abs photo ${gen ? "gen" : ""} ${opts.cls ?? ""}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;${opts.style ?? ""}">
    <img src="${img(name, gen)}" style="transform:scale(${kb});transform-origin:${opts.origin ?? "50% 40%"};filter:${filt};object-position:${opts.pos ?? "50% 50%"}">
    ${opts.overlay ?? ""}</div>`;
}
const BG = `<div class="grid"></div>`;
function ribbon(side, p) {               // flowing red ribbon decoration (reference style)
  const x = side === "r" ? 1920 : 0, f = side === "r" ? -1 : 1;
  const w = 26 + 8 * Math.sin(T * 0.8);
  const path = `M ${x} ${-40 + 0} C ${x + f * (220 + 40 * Math.sin(T * .6))} 240, ${x + f * (60)} 520, ${x + f * (240 + 30 * Math.cos(T * .7))} 1120`;
  return `<svg class="abs" style="left:0;top:0;opacity:${p}" width="1920" height="1080">
    <path d="${path}" stroke="#E0262B" stroke-width="${w}" fill="none" stroke-linecap="round" opacity=".9"/>
    <path d="${path}" stroke="#FF6B6E" stroke-width="${w * 0.35}" fill="none" stroke-linecap="round" opacity=".5" transform="translate(${f * 18},0)"/></svg>`;
}

function leaks(k = 1) {                 // drifting red light leaks (reference 2 style)
  const a = 0.55 + 0.25 * Math.sin(T * 1.7), b = 0.45 + 0.25 * Math.cos(T * 1.3);
  return `<div class="abs" style="inset:0;pointer-events:none;mix-blend-mode:screen;opacity:${k}">
    <div class="abs" style="left:${-420 + 60 * Math.sin(T * .5)}px;top:${-200 + 80 * Math.cos(T * .4)}px;width:1000px;height:900px;border-radius:50%;background:radial-gradient(closest-side,rgba(224,38,43,${a}),rgba(224,38,43,0))"></div>
    <div class="abs" style="right:${-460 + 70 * Math.cos(T * .45)}px;bottom:${-300 + 60 * Math.sin(T * .6)}px;width:1100px;height:900px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,70,40,${b}),rgba(255,70,40,0))"></div></div>`;
}

// ---------- stick-figure rig (2-bone IK) ----------
const L = { thigh: 95, shin: 95, torso: 140, upper: 66, fore: 62, neck: 18, head: 24 };
function ik(a, b, l1, l2, bend) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  let d = Math.hypot(dx, dy); d = Math.min(d, l1 + l2 - 0.01);
  const ang = Math.atan2(dy, dx);
  const cos = clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1);
  const off = Math.acos(cos) * bend;
  return [a[0] + l1 * Math.cos(ang + off), a[1] + l1 * Math.sin(ang + off)];
}
const D2R = Math.PI / 180;
function mixPose(A, B, p) {
  const m = (u, v) => Array.isArray(u) ? u.map((x, i) => lerp(x, v[i], p)) : (typeof u === "number" ? lerp(u, v, p) : u);
  const o = {}; for (const k in A) o[k] = Array.isArray(A[k]) && Array.isArray(A[k][0]) ? A[k].map((q, i) => m(q, B[k][i])) : m(A[k], B[k]);
  return o;
}
// pose: hip, torso(deg, 90 = up), hands[2], feet[2] (ankles), knee/elbow bend signs, face dir
function drawFigure(P, hi = []) {
  const hip = P.hip, ta = P.torso * D2R;
  const sh = [hip[0] + L.torso * Math.cos(ta), hip[1] - L.torso * Math.sin(ta)];
  const neckEnd = [sh[0] + L.neck * Math.cos(ta), sh[1] - L.neck * Math.sin(ta)];
  const head = [neckEnd[0] + L.head * Math.cos(ta + (P.headTilt ?? 0) * D2R), neckEnd[1] - L.head * Math.sin(ta + (P.headTilt ?? 0) * D2R)];
  const ink = "#16161A", red = "#E0262B";
  const col = part => hi.includes(part) ? red : ink;
  let s = "";
  const seg = (a, b, c, w) => `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
  const legs = [], arms = [];
  P.feet.forEach((f, i) => {
    const knee = ik(hip, f, L.thigh, L.shin, P.kneeBend[i]);
    const toe = [f[0] + (P.toeDir?.[i] ?? 1) * 34 * Math.cos((P.toeAng?.[i] ?? 0) * D2R), f[1] - 34 * Math.sin((P.toeAng?.[i] ?? 0) * D2R)];
    legs.push({ knee, f, toe, far: i === 1 });
  });
  P.hands.forEach((h, i) => { arms.push({ el: ik(sh, h, L.upper, L.fore, P.elbowBend[i]), h, far: i === 1 }); });
  const legCol = { thigh: col("thigh"), ham: col("hamstring") };
  const drawLeg = (g, alpha) => {
    const thighC = hi.includes("thigh") || hi.includes("hamstring") ? red : ink;
    s += `<g opacity="${alpha}">` + seg(hip, g.knee, thighC, 30) + seg(g.knee, g.f, hi.includes("calf") ? red : ink, 24) + seg(g.f, g.toe, ink, 16) + `</g>`;
  };
  const drawArm = (g, alpha) => {
    s += `<g opacity="${alpha}">` + seg(sh, g.el, hi.includes("upperarm") || hi.includes("shoulder") ? red : ink, 22) + seg(g.el, g.h, hi.includes("forearm") ? red : ink, 18) + `</g>`;
  };
  legs.filter(l => l.far).forEach(l => drawLeg(l, .45));
  arms.filter(a => a.far).forEach(a => drawArm(a, .45));
  // torso as a tapered quad
  const nx = -Math.sin(ta), ny = -Math.cos(ta);
  const torsoC = (hi.includes("core") || hi.includes("back") || hi.includes("chest")) ? red : ink;
  s += `<path d="M ${hip[0] - nx * 20} ${hip[1] - ny * 20} L ${sh[0] - nx * 26} ${sh[1] - ny * 26} L ${sh[0] + nx * 26} ${sh[1] + ny * 26} L ${hip[0] + nx * 20} ${hip[1] + ny * 20} Z" fill="${torsoC}" stroke="${torsoC}" stroke-width="10" stroke-linejoin="round"/>`;
  if (hi.includes("glute")) s += `<circle cx="${hip[0] - Math.cos(ta - Math.PI / 2) * 0}" cy="${hip[1]}" r="24" fill="${red}"/>`;
  else s += `<circle cx="${hip[0]}" cy="${hip[1]}" r="20" fill="${ink}"/>`;
  s += seg(sh, neckEnd, ink, 16);
  s += `<circle cx="${head[0]}" cy="${head[1]}" r="${L.head}" fill="${ink}"/>`;
  legs.filter(l => !l.far).forEach(l => drawLeg(l, 1));
  arms.filter(a => !a.far).forEach(a => drawArm(a, 1));
  return { svg: s, hands: arms.map(a => a.h), sh, hip, head };
}
const dumbbell = (h, ang = 0, s = 1) => `<g transform="translate(${h[0]},${h[1]}) rotate(${ang}) scale(${s})">
  <rect x="-30" y="-6" width="60" height="12" rx="4" fill="#3A3A40"/>
  <rect x="-40" y="-20" width="16" height="40" rx="5" fill="#222"/><rect x="24" y="-20" width="16" height="40" rx="5" fill="#222"/></g>`;
const FLOOR = 540;
const POSES = {
  squat: {
    A: { hip: [300, 330], torso: 90, feet: [[300, 520], [312, 520]], hands: [[338, 258], [346, 262]], kneeBend: [-1, -1], elbowBend: [1, 1] },
    B: { hip: [236, 420], torso: 64, feet: [[300, 520], [312, 520]], hands: [[352, 352], [360, 356]], kneeBend: [-1, -1], elbowBend: [1, 1] },
    props: (f) => dumbbell([f.hands[0][0] + 4, f.hands[0][1] - 4], 90, .9), hi: ["thigh", "glute"]
  },
  rdl: {
    A: { hip: [300, 330], torso: 90, feet: [[300, 520], [312, 520]], hands: [[306, 314], [314, 318]], kneeBend: [-1, -1], elbowBend: [-1, -1] },
    B: { hip: [250, 338], torso: 20, feet: [[300, 520], [312, 520]], hands: [[392, 418], [400, 420]], kneeBend: [-1, -1], elbowBend: [-1, -1] },
    props: (f) => dumbbell(f.hands[0], 0, .95), hi: ["hamstring", "glute", "back"]
  },
  pushup: {
    A: { hip: [256, 396], torso: 35, feet: [[100, 508], [106, 510]], hands: [[392, 432], [398, 432]], kneeBend: [-1, -1], elbowBend: [-1, -1], toeAng: [-60, -60] },
    B: { hip: [276, 434], torso: 22, feet: [[100, 508], [106, 510]], hands: [[392, 432], [398, 432]], kneeBend: [-1, -1], elbowBend: [-1, -1], toeAng: [-60, -60] },
    props: () => `<rect x="360" y="432" width="200" height="22" rx="8" fill="#2A2A2E"/><rect x="380" y="454" width="16" height="66" fill="#2A2A2E"/><rect x="520" y="454" width="16" height="66" fill="#2A2A2E"/>`,
    hi: ["chest", "upperarm"]
  },
  row: {
    A: { hip: [240, 322], torso: 14, feet: [[296, 520], [190, 520]], hands: [[382, 440], [420, 400]], kneeBend: [-1, -1], elbowBend: [-1, 1] },
    B: { hip: [240, 322], torso: 14, feet: [[296, 520], [190, 520]], hands: [[312, 340], [420, 400]], kneeBend: [-1, -1], elbowBend: [-1, 1] },
    props: (f) => `<rect x="380" y="400" width="200" height="22" rx="8" fill="#2A2A2E"/><rect x="400" y="422" width="16" height="98" fill="#2A2A2E"/><rect x="540" y="422" width="16" height="98" fill="#2A2A2E"/>` + dumbbell(f.hands[0], 0, .9),
    hi: ["back", "upperarm"]
  },
  press: {
    A: { hip: [300, 420], torso: 90, feet: [[392, 520], [400, 520]], hands: [[316, 262], [324, 266]], kneeBend: [-1, -1], elbowBend: [1, 1] },
    B: { hip: [300, 420], torso: 90, feet: [[392, 520], [400, 520]], hands: [[306, 140], [314, 142]], kneeBend: [-1, -1], elbowBend: [1, 1] },
    props: (f) => `<rect x="240" y="430" width="140" height="20" rx="6" fill="#2A2A2E"/><rect x="240" y="160" width="22" height="290" rx="8" fill="#2A2A2E"/><rect x="300" y="450" width="14" height="70" fill="#2A2A2E"/>` + dumbbell(f.hands[0], 0, .9),
    hi: ["shoulder", "upperarm"]
  },
  stepup: {
    A: { hip: [262, 330], torso: 86, feet: [[372, 418], [262, 520]], hands: [[268, 316], [276, 318]], kneeBend: [-1, -1], elbowBend: [-1, -1] },
    B: { hip: [366, 236], torso: 88, feet: [[372, 418], [338, 410]], hands: [[372, 222], [380, 224]], kneeBend: [-1, -1], elbowBend: [-1, -1] },
    props: () => `<rect x="320" y="428" width="170" height="92" rx="10" fill="#2A2A2E"/>`,
    hi: ["thigh", "glute"]
  },
  carry: {
    A: { hip: [300, 330], torso: 90, feet: [[262, 520], [338, 520]], hands: [[304, 316], [312, 318]], kneeBend: [-1, -1], elbowBend: [-1, -1] },
    B: { hip: [300, 334], torso: 90, feet: [[338, 520], [262, 520]], hands: [[304, 318], [312, 320]], kneeBend: [-1, -1], elbowBend: [-1, -1] },
    props: (f) => dumbbell([f.hands[0][0], f.hands[0][1] + 6], 0, 1.05), hi: ["forearm", "core", "back"]
  },
  deadbug: {
    A: { hip: [330, 488], torso: 180, feet: [[420, 394], [432, 396]], hands: [[192, 368], [200, 370]], kneeBend: [-1, -1], elbowBend: [1, 1], toeDir: [1, 1], headTilt: 0 },
    B: { hip: [330, 488], torso: 180, feet: [[420, 394], [510, 474]], hands: [[60, 470], [200, 370]], kneeBend: [-1, -1], elbowBend: [1, 1], toeDir: [1, 1] },
    props: () => `<rect x="80" y="514" width="480" height="12" rx="6" fill="#E0262B" opacity=".25"/>`, hi: ["core"]
  },
};
function figureSVG(kind, t, w = 640, h = 560, period = 2.6) {
  const P = POSES[kind];
  const phase = (t % period) / period;
  const p = 0.5 - 0.5 * Math.cos(phase * 2 * Math.PI);
  const pose = mixPose(P.A, P.B, easeInOut(p));
  const f = drawFigure(pose, P.hi);
  return `<svg width="${w}" height="${h}" viewBox="0 60 640 500">
    <line x1="0" y1="${520}" x2="640" y2="${520}" stroke="#16161A" stroke-width="4" opacity=".15"/>
    ${P.props(f)}${f.svg}</svg>`;
}

// ---------- scenes ----------
const S = {};
const C = sc => sc.cues;

S.hook = sc => {
  const c = C(sc); let h = "";
  // part A: user's back photo, full bleed
  const aEnd = c["wrong exercises"];
  if (T < aEnd + 0.4) {
    const fade = 1 - prog(aEnd, aEnd + 0.4);
    h += `<div class="abs" style="inset:0;background:#0B0B0C;opacity:${fade}">
      ${photo(560, -230, 1540, 1540, "back", { gen: false, kbFrom: sc.start, kbTo: aEnd, style: "border-radius:0;", origin: "50% 60%" })}
      <div class="abs" style="inset:0;background:linear-gradient(90deg,#0B0B0C 32%,rgba(11,11,12,.55) 55%,rgba(11,11,12,.1))"></div>${leaks(.7)}
      <div class="abs disp" style="left:120px;top:300px;color:#fff;font-weight:700;font-size:72px;${appear(sc.start + 0.1)}">Your body has an</div>
      <div class="abs disp" style="left:112px;top:380px;color:var(--red);font-weight:900;font-size:230px;line-height:1;${appear(c["engine"], { dy: 80, scale: .8 })};text-shadow:0 0 60px rgba(224,38,43,.45)">ENGINE.</div>
      <div class="abs" style="left:124px;top:650px;color:#cfcfcf;font-size:34px;font-weight:500;${appear(c["first day"])}">Most beginners start it <span class="hl">the wrong way</span>.</div>
    </div>`;
  }
  if (T >= aEnd) {
    h += `<div class="abs" style="inset:0;background:var(--night)"></div>` + leaks(1);
    const items = [["Wrong exercises", c["wrong exercises"]], ["Too much weight", c["too much"]], ["No plan", c["no plan"]]];
    const out = c["in the next"];
    h += `<div class="abs label" style="left:0;right:0;top:220px;text-align:center;color:#bbb;${appear(aEnd, { until: out })}">The old way</div>`;
    h += items.map((it, i) => `<div class="abs dark" style="left:${200 + i * 520}px;top:330px;width:460px;height:300px;${appear(it[1], { until: out })}">
        <div class="abs" style="left:40px;top:40px;width:90px;height:90px;border-radius:50%;background:var(--red);color:#fff;font-size:56px;font-weight:900;display:flex;align-items:center;justify-content:center;transform:scale(${spring(T - it[1] - 0.25, .4)})">✕</div>
        <div class="abs disp" style="left:40px;top:170px;font-size:52px;font-weight:800;color:#fff"><span style="position:relative;display:inline-block">${it[0]}<span class="abs" style="left:-6px;top:52%;height:7px;border-radius:4px;background:var(--red);width:calc(${100 * easeOut(prog(it[1] + 0.35, it[1] + 0.7))}% + 12px)"></span></span></div></div>`).join("");
    const steps = [["How the engine starts", c["engine starts"]], ["8 exercises", c["eight exercises"]], ["The weekly plan", c["weekly plan"]]];
    h += `<div class="abs disp" style="left:0;right:0;top:190px;text-align:center;font-size:64px;font-weight:800;color:#fff;${appear(out)}">In this video</div>`;
    h += `<div class="abs" style="left:300px;top:520px;height:6px;width:${1320 * prog(out, c["weekly plan"] + 0.5)}px;background:var(--red);border-radius:3px"></div>`;
    h += steps.map((s, i) => `<div class="abs" style="left:${200 + i * 620}px;top:440px;width:520px;text-align:center;${appear(s[1])}">
        <div style="margin:0 auto;width:160px;height:160px;border-radius:50%;background:${i === 1 ? "var(--red)" : "#fff"};color:${i === 1 ? "#fff" : "#141416"};display:flex;align-items:center;justify-content:center;font-size:70px;font-weight:900;box-shadow:0 0 40px rgba(224,38,43,.45)" class="disp">${i + 1}</div>
        <div class="disp" style="margin-top:30px;font-size:44px;font-weight:800;color:#fff">${s[0]}</div></div>`).join("");
  }
  return h;
};

S.chapter = sc => {
  const p = prog(sc.start, sc.start + 0.5);
  return `<div class="abs" style="inset:0;background:var(--night)">
    ${leaks(.8)}${ribbon("r", .9)}
    <div class="abs label" style="left:160px;top:380px;font-size:30px;${appear(sc.start + 0.1)}">${sc.label}</div>
    <div class="abs disp" style="left:150px;top:430px;color:#fff;font-size:150px;font-weight:900;${appear(sc.start + 0.2, { dy: 60 })}">${sc.title}</div>
    <div class="abs" style="left:160px;top:640px;height:8px;width:${560 * easeOut(p)}px;background:var(--red);border-radius:4px"></div></div>`;
};

S.stinger = sc => {
  const p = easeOut(prog(sc.start, sc.start + 0.45));
  return `<div class="abs" style="inset:0;background:var(--red)">
    <div class="abs disp" style="right:${-80 + 200 * (1 - p)}px;top:40px;color:rgba(255,255,255,.16);font-size:900px;font-weight:900;line-height:1">0${sc.n}</div>
    <div class="abs label" style="left:150px;top:400px;color:#fff;opacity:.85;font-size:30px;${appear(sc.start + 0.1)}">Exercise 0${sc.n} / 08</div>
    <div class="abs disp" style="left:140px;top:450px;color:#fff;font-size:130px;font-weight:900;${appear(sc.start + 0.15, { dy: 70 })}">${sc.name}</div></div>`;
};

        <rect x="0" y="80" width="300" height="80" rx="40" fill="#FBE3E2"/><text x="20" y="66" font-size="24" font-weight="700" fill="#6B6862">BLOOD</text>

        ${[0, 1, 2, 3, 4, 5].map(k => { const q = ((T - bonus) * 0.5 + k / 6) % 1; const x = 40 + q * 560; return `<circle cx="${x}" cy="${120 + Math.sin(q * 6 + k) * 18}" r="14" fill="#E0262B" opacity="${q < .85 ? 1 : (1 - q) * 6}"/>`; }).join("")}
      </svg></div>`;

    const shown = Math.floor(61 * easeOut(prog(after, after + 1.6)));

      <div class="abs disp" style="left:40px;top:76px;font-size:50px;font-weight:900;width:740px">Extra oxygen use for <span class="hl">hours</span> after</div>

    </svg>`;
    h += `<div class="abs card" style="left:1300px;top:300px;width:500px;padding:36px;${appear(c["double progression"] + .3)}">
      <div class="label">The rule</div><div style="font-size:36px;font-weight:700;margin-top:16px;line-height:1.35">Hit <b>12 reps</b> on every set →<br><span class="hl">add a little weight</span></div></div>`;
    h += `<div class="abs disp" style="left:1300px;top:700px;width:520px;font-size:46px;font-weight:900;line-height:1.1;${appear(c["steady increase"])}">The signal that keeps your engine <span style="color:var(--red)">growing</span>.</div>`;
  }
  return h;
};

S.recovery = sc => {
  const c = C(sc); let h = ribbon("r", .9);
  h += `<div class="abs disp" style="left:140px;top:110px;font-size:80px;font-weight:900;${appear(sc.start)}">Fuel & maintenance</div>`;
  const items = [["protein", "1.6 g/kg", "protein per day", c["protein"], "🍳"], ["sleep", "7–9 h", "sleep — muscle is built here", c["sleep"], "🌙"], ["steps", "7–8k", "steps a day", c["steps"], "👟"]];
  h += items.map((it, i) => `<div class="abs card" style="left:${140 + i * 560}px;top:250px;width:520px;height:600px;overflow:hidden;${appear(it[3])}">
     ${photo(0, 0, 520, 340, it[0], { kbFrom: it[3], kbTo: sc.end, style: "border-radius:28px 28px 0 0", fallback: `<div class="abs" style="left:0;top:0;width:520px;height:340px;border-radius:28px 28px 0 0;background:${i === 1 ? "#141416" : "var(--red-soft)"};display:flex;align-items:center;justify-content:center;font-size:150px">${it[4]}</div>` })}
     <div class="abs disp" style="left:36px;top:380px;font-size:90px;font-weight:900;color:var(--red)">${it[1]}</div>
     <div class="abs" style="left:40px;top:500px;width:450px;font-size:34px;font-weight:700;line-height:1.3">${it[2]}</div></div>`).join("");
  h += `<div class="abs pill" style="left:540px;top:872px;background:#141416;color:#fff;font-size:30px;${appear(c["everyday movement"])}">Everyday movement often burns more than the workout</div>`;
  return h;
};

S.mistakes = sc => {
  const c = C(sc); let h = ribbon("r", .9);
  h += `<div class="abs disp" style="left:140px;top:120px;font-size:84px;font-weight:900;${appear(sc.start)}">3 beginner mistakes</div>`;
  const m = [["Too heavy, too soon", c["one:"]], ["Skipping the warm-up", c["two:"]], ["New program every week", c["three:"]]];
  h += m.map((x, i) => `<div class="abs dark" style="left:${140 + i * 560}px;top:300px;width:520px;height:440px;${appear(x[1], { scale: .85 })}">
     <div class="abs disp" style="left:40px;top:30px;font-size:160px;font-weight:900;color:var(--red)">${i + 1}</div>
     <div class="abs" style="right:40px;top:50px;width:90px;height:90px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:900">✕</div>
     <div class="abs disp" style="left:40px;top:260px;width:440px;font-size:54px;font-weight:900;line-height:1.08">${x[0]}</div></div>`).join("");
  h += `<div class="abs card" style="left:440px;top:800px;padding:26px 44px;font-size:40px;font-weight:800;${appear(c["results"])}"><span style="color:#1a9a4b">✓</span> Repeat the basics + add a little more</div>`;
  return h;
};

S.outro = sc => {
  const c = C(sc); let h = "";
  h += `<div class="abs" style="right:0;top:0;width:820px;height:1080px;${appear(sc.start, { dy: 0, scale: 1.02 })}">${photo(0, 0, 820, 1080, "front", { gen: false, kbFrom: sc.start, kbTo: sc.end, pos: "30% 62%", style: "border-radius:0", origin: "30% 60%" })}
     <div class="abs" style="inset:0;background:linear-gradient(90deg,var(--paper) 0%,rgba(243,241,236,0) 30%)"></div></div>`;
  h += `<div class="abs label" style="left:140px;top:130px;${appear(c["ignition sequence"])}">Your ignition sequence</div>`;
  const seq = [["Warm up", c["warm up"]], ["8 exercises", c["eight exercises"]], ["Cardio", c["cardio"]], ["3× a week", c["three days"]]];
  h += seq.map((s, i) => `<div class="abs pill disp" style="left:140px;top:${200 + i * 108}px;background:${i === 3 ? "var(--red)" : "#141416"};color:#fff;font-size:44px;${appear(s[1], { dy: 0 })};transform:translateX(${(1 - spring(T - s[1])) * -80}px)">${i + 1} · ${s[0]}</div>`).join("");
  h += `<div class="abs disp" style="left:140px;top:640px;width:900px;font-size:66px;font-weight:900;line-height:1.05;${appear(c["start light"])}">Start light. Stay <span class="hl">consistent.</span></div>`;
  h += `<div class="abs" style="left:140px;top:752px;width:860px;font-size:26px;color:var(--muted);${appear(c["medical"])}">Medical condition or injury? Check with your doctor first.</div>`;
  h += `<div class="abs pill" style="left:140px;top:810px;background:var(--red);color:#fff;font-size:36px;${appear(c["save this"], { scale: .6 })}">🔖 Save this for your next gym day</div>`;
  return h;
};

S.endcard = sc => {
  const c = sc.cues || {}, ch = sc.channel || {};
  const sub = c["subscribe"] ?? sc.start + 1.2, click = sub + 0.55;
  const clicked = T >= click;
  // cursor glides to the button, clicks, then rests
  const cp = easeInOut(prog(sub - 0.6, click - 0.05));
  const cx = lerp(820, 470, cp), cy = lerp(980, 742, cp), press = clicked && T < click + 0.15 ? 0.85 : 1;
  const ring = clicked ? prog(click, click + 0.6) : 0;
  let h = `<div class="abs" style="inset:0;background:var(--night)">${leaks(1)}${ribbon("r", .5)}`;
  // channel identity
  h += `<div class="abs" style="left:140px;top:170px;width:230px;height:230px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 6px var(--red),0 0 60px rgba(224,38,43,.6);${appear(sc.start + 0.1, { scale: .7 })}">
      <img src="${img("side", false)}" style="position:absolute;width:330%;height:330%;left:-118%;top:-38%;object-fit:cover;filter:grayscale(1) contrast(1.1)"></div>`;
  h += `<div class="abs disp" style="left:410px;top:205px;color:#fff;font-size:92px;font-weight:900;${appear(sc.start + 0.25)}">${ch.name || ""}</div>`;
  h += `<div class="abs" style="left:416px;top:325px;color:var(--red);font-size:44px;font-weight:800;${appear(sc.start + 0.4)}">${ch.handle || ""}</div>`;
  // subscribe button
  h += `<div class="abs" style="left:140px;top:690px;${appear(sc.start + 0.6)}">
      <div style="transform:scale(${press});display:inline-flex;align-items:center;gap:18px;padding:22px 44px;border-radius:999px;font-family:Inter;font-weight:800;font-size:44px;
        background:${clicked ? "#2A2A2E" : "var(--red)"};color:#fff;box-shadow:${clicked ? "none" : "0 0 50px rgba(224,38,43,.7)"}">${clicked ? "✓ Subscribed" : "▶ Subscribe"}</div>
      <div style="display:inline-flex;vertical-align:top;margin-left:20px;width:104px;height:104px;border-radius:50%;background:#2A2A2E;align-items:center;justify-content:center;font-size:52px;
        transform:rotate(${clicked ? 18 * Math.sin((T - click) * 20) * Math.exp(-(T - click) * 3) : 0}deg);opacity:${clicked ? 1 : .35}">🔔</div>
      <div class="abs" style="left:-20px;top:-20px;width:${420 + 120 * ring}px;height:${150 + 60 * ring}px;border-radius:999px;border:4px solid rgba(224,38,43,${1 - ring});transform:translate(${-60 * ring}px,${-30 * ring}px)"></div></div>`;
  h += `<svg class="abs" style="left:${cx}px;top:${cy}px;${T < sub - 0.6 ? "opacity:0" : ""}" width="60" height="70"><path d="M5 5 L5 55 L18 43 L28 64 L37 60 L27 39 L45 39 Z" fill="#fff" stroke="#111" stroke-width="3" transform="scale(${press})"/></svg>`;
  h += `<div class="abs disp" style="left:140px;top:480px;color:#fff;font-size:76px;font-weight:900;${appear(sc.start + 0.8)}">Start your <span style="color:var(--red)">engine.</span></div>`;
  h += `<div class="abs" style="left:146px;top:580px;color:#9a9a9a;font-size:32px;font-weight:600;${appear(sc.start + 1)}">More training videos on the channel</div>`;
  // empty frames for YouTube end-screen video elements
  h += [0, 1].map(i => `<div class="abs" style="left:1100px;top:${120 + i * 450}px;width:680px;height:383px;border-radius:24px;border:3px dashed rgba(255,255,255,.28);background:rgba(255,255,255,.03);${appear(sc.start + 0.5 + i * 0.2)}">
      <div class="abs label" style="left:30px;top:26px;color:#bbb">${i ? "More from " + (ch.handle || "") : "Watch next"}</div>
      <div class="abs" style="left:290px;top:140px;width:100px;height:100px;border-radius:50%;background:rgba(224,38,43,.85);display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff">▶</div></div>`).join("");
  h += `<div class="abs" style="inset:0;background:#000;opacity:${prog(sc.end - 0.8, sc.end)}"></div></div>`;
  return h;
};

// ---------- frame ----------
let TL = null;
const CHAPTER_OF = id => id < "s03" ? "The Engine" : id < "s13" ? "The Workout" : "The Plan";
window.setTimeline = tl => { TL = tl; };
window.renderAt = t => {
  T = t;
  const sc = TL.scenes.find(s => t >= s.start && t < s.end) || TL.scenes[TL.scenes.length - 1];
  const darkScene = ["chapter", "stinger", "endcard", "hook"].includes(sc.kind);
  let h = darkScene ? "" : BG;
  h += (S[sc.kind] || (() => ""))(sc);
  // scene-in wipe
  const since = t - sc.start;
  if (since < 0.35 && sc.kind !== "hook") h += `<div class="abs" style="inset:0;background:var(--red);transform:translateX(${easeInOut(since / 0.35) * 100}%);z-index:70"></div>`;
  if (!["chapter", "stinger", "endcard"].includes(sc.kind)) {
    const cap = TL.captions.find(c => t >= c.s && t < c.e);
    if (cap) h += `<div class="caption">${cap.words.map((w, i) => `<span class="box ${i === cap.hl ? "r" : ""}" style="${appear(cap.s + i * 0.04, { dy: 14, scale: .9, dur: .3 })}">${w.replace(/[,.:;]$/, "")}</span>`).join("")}</div>`;
    h += `<div class="progress" style="width:${1920 * t / TL.duration}px"></div>`;
    if (!darkScene) h += `<div class="chapterTag"><b>●</b> ${CHAPTER_OF(sc.id)}</div>`;
    h += `<div class="abs" style="right:56px;top:30px;z-index:60;font-size:22px;font-weight:800;letter-spacing:.04em;color:${darkScene ? "rgba(255,255,255,.75)" : "rgba(18,18,18,.55)"}"><span style="color:var(--red)">▶</span> @drmakfitness</div>`;
  }
  document.getElementById("stage").innerHTML = h;
};
</script>
</body>
</html>
