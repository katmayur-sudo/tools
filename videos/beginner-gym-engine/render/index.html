<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Beginner Gym Engine</title>
<style>
  :root {
    --paper: #F3F1EC; --paper2: #E9E6DF; --ink: #121212; --muted: #6B6862;
    --red: #E0262B; --red-soft: #FBE3E2; --card: #FFFFFF; --night: #0E0E10;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
  body { font-family: "Inter", sans-serif; color: var(--ink); }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  .abs { position: absolute; }
  .disp { font-family: "Inter Display", "Inter", sans-serif; letter-spacing: -0.03em; }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(0,0,0,.035) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(0,0,0,.035) 1px, transparent 1px);
    background-size: 64px 64px; }
  .card { background: var(--card); border-radius: 28px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.05); }
  .dark { background: #141416; color: #fff; border-radius: 28px;
    box-shadow: 0 30px 70px -20px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.06) inset; }
  .pill { display: inline-flex; align-items: center; gap: 12px; border-radius: 999px;
    padding: 12px 26px; font-weight: 700; }
  .hl { background: var(--red); color: #fff; border-radius: 10px; padding: 0 12px; }
  .glow { box-shadow: 0 0 0 3px rgba(224,38,43,.9), 0 0 24px rgba(224,38,43,.55); }
  .photo { overflow: hidden; border-radius: 26px; }
  .photo img { position: absolute; width: 100%; height: 100%; object-fit: cover; }
  .gen img { width: 116%; height: 116%; left: -1%; top: -1%; }  /* crops the generator watermark */
  .chip { display: inline-block; padding: 10px 20px; border-radius: 999px; background: #fff;
    border: 2px solid rgba(0,0,0,.08); font-weight: 600; font-size: 26px; margin: 0 10px 10px 0; }
  .label { font-size: 22px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--red); }
  .caption { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; z-index: 50; }
  .caption span.box { display: inline-block; font-family: "Inter Display", "Inter"; font-weight: 800;
    font-size: 46px; letter-spacing: -0.02em; padding: 6px 16px; border-radius: 12px; margin: 0 4px;
    background: #111; color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.14), 0 10px 24px -8px rgba(0,0,0,.4); }
  .caption span.box.r { background: var(--red); }
  .progress { position: absolute; left: 0; top: 0; height: 6px; background: var(--red); z-index: 60; }
  .chapterTag { position: absolute; left: 56px; top: 34px; z-index: 60; font-size: 20px; font-weight: 700;
    letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .chapterTag b { color: var(--red); }
  svg text { font-family: "Inter", sans-serif; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = p => 1 - Math.pow(1 - clamp(p), 3);
const easeInOut = p => { p = clamp(p); return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
function spring(t, d = 0.55) {            // 0 -> 1 with a small overshoot
  if (t <= 0) return 0; if (t >= d * 2) return 1;
  const p = t / d; return 1 - Math.exp(-5 * p) * Math.cos(7 * p);
}
let T = 0;                                  // current absolute time (seconds)
// appear(at): style for an element popping in at absolute time `at`
function appear(at, opts = {}) {
  const dy = opts.dy ?? 40, sc = opts.scale ?? 0.92, dur = opts.dur ?? 0.5;
  const dt = T - at;
  if (dt < 0) return "opacity:0;";
  const s = spring(dt, dur), o = clamp(dt / (dur * 0.6));
  let st = `opacity:${o};transform:translateY(${(1 - s) * dy}px) scale(${lerp(sc, 1, s)});`;
  if (opts.until !== undefined && T > opts.until) {
    const q = clamp((T - opts.until) / 0.3);
    st = `opacity:${1 - q};transform:translateY(${-q * 30}px) scale(${1 - q * 0.04});`;
  }
  return st;
}
const on = at => T >= at;
const prog = (a, b) => clamp((T - a) / (b - a));
const img = (name, gen = true) => gen ? `../assets/img/${name}.jpg` : `../assets/user/${name}.jpg`;
function photo(x, y, w, h, name, opts = {}) {
  const gen = opts.gen ?? true;
  if (gen && TL && TL.images && !TL.images.includes(name)) return opts.fallback ?? "";
  const kb = 1 + 0.06 * prog(opts.kbFrom ?? 0, opts.kbTo ?? 1);
  const filt = opts.filter ?? (gen ? "saturate(.9) contrast(1.02)" : "grayscale(1) contrast(1.08)");
  return `<div class="abs photo ${gen ? "gen" : ""} ${opts.cls ?? ""}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;${opts.style ?? ""}">
    <img src="${img(name, gen)}" style="transform:scale(${kb});transform-origin:${opts.origin ?? "50% 40%"};filter:${filt};object-position:${opts.pos ?? "50% 50%"}">
    ${opts.overlay ?? ""}</div>`;
}
const BG = `<div class="grid"></div>`;
function ribbon(side, p) {               // flowing red ribbon decoration (reference style)
  const x = side === "r" ? 1920 : 0, f = side === "r" ? -1 : 1;
  const w = 26 + 8 * Math.sin(T * 0.8);
  const path = `M ${x} ${-40 + 0} C ${x + f * (220 + 40 * Math.sin(T * .6))} 240, ${x + f * (60)} 520, ${x + f * (240 + 30 * Math.cos(T * .7))} 1120`;
  return `<svg class="abs" style="left:0;top:0;opacity:${p}" width="1920" height="1080">
    <path d="${path}" stroke="#E0262B" stroke-width="${w}" fill="none" stroke-linecap="round" opacity=".9"/>
    <path d="${path}" stroke="#FF6B6E" stroke-width="${w * 0.35}" fill="none" stroke-linecap="round" opacity=".5" transform="translate(${f * 18},0)"/></svg>`;
}

function leaks(k = 1) {                 // drifting red light leaks (reference 2 style)
  const a = 0.55 + 0.25 * Math.sin(T * 1.7), b = 0.45 + 0.25 * Math.cos(T * 1.3);
  return `<div class="abs" style="inset:0;pointer-events:none;mix-blend-mode:screen;opacity:${k}">
    <div class="abs" style="left:${-420 + 60 * Math.sin(T * .5)}px;top:${-200 + 80 * Math.cos(T * .4)}px;width:1000px;height:900px;border-radius:50%;background:radial-gradient(closest-side,rgba(224,38,43,${a}),rgba(224,38,43,0))"></div>
    <div class="abs" style="right:${-460 + 70 * Math.cos(T * .45)}px;bottom:${-300 + 60 * Math.sin(T * .6)}px;width:1100px;height:900px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,70,40,${b}),rgba(255,70,40,0))"></div></div>`;
}

// ---------- motion-graphic illustrations (replace stock images) ----------
function gearPath(r, teeth, depth) {
  let d = "";
  for (let i = 0; i < teeth * 2; i++) {
    const a0 = (i / (teeth * 2)) * 2 * Math.PI, a1 = ((i + 1) / (teeth * 2)) * 2 * Math.PI;
    const rr = i % 2 ? r - depth : r;
    d += `${i ? "L" : "M"} ${rr * Math.cos(a0)} ${rr * Math.sin(a0)} L ${rr * Math.cos(a1)} ${rr * Math.sin(a1)} `;
  }
  return d + "Z";
}
const floaty = (k, sp = 1) => Math.sin(T * sp + k * 1.7);
function mgEngine(x, y, w, h) {                      // food -> engine -> energy
  const cx = w / 2, cy = h / 2, rot = T * 40;
  const foods = ["🍗", "🥚", "🍚", "🍌", "🥜"];
  let f = foods.map((e, k) => { const q = ((T * 0.45 + k / foods.length) % 1); const px = lerp(-40, cx - 60, easeInOut(q)), py = cy + Math.sin(q * Math.PI * 2 + k) * 120 * (1 - q);
    return `<div class="abs" style="left:${px}px;top:${py - 30}px;font-size:${56 - q * 20}px;opacity:${q < .9 ? 1 : (1 - q) * 10}">${e}</div>`; }).join("");
  let bolts = [0, 1, 2, 3].map(k => { const q = ((T * 0.7 + k / 4) % 1); const ang = (-40 + k * 27) * D2R;
    return `<div class="abs" style="left:${cx + Math.cos(ang) * (120 + q * 260)}px;top:${cy + Math.sin(ang) * (120 + q * 260) - 30}px;font-size:54px;opacity:${1 - q}">⚡</div>`; }).join("");
  const pulse = 1 + 0.08 * Math.sin(T * 6);
  return `<div class="abs dark" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;overflow:hidden">${leaks(.5)}
    <svg class="abs" style="left:0;top:0" width="${w}" height="${h}">
      <g transform="translate(${cx - 70},${cy - 40}) rotate(${rot})"><path d="${gearPath(150, 14, 26)}" fill="none" stroke="#E0262B" stroke-width="10"/><circle r="48" fill="none" stroke="#E0262B" stroke-width="10"/></g>
      <g transform="translate(${cx + 130},${cy + 120}) rotate(${-rot * 1.8})"><path d="${gearPath(80, 9, 18)}" fill="none" stroke="#fff" stroke-width="8" opacity=".85"/></g>
      <circle cx="${cx - 70}" cy="${cy - 40}" r="${70 * pulse}" fill="url(#core)"/>
      <defs><radialGradient id="core"><stop offset="0" stop-color="#FFD0A0"/><stop offset=".4" stop-color="#FF6B3D"/><stop offset="1" stop-color="#E0262B" stop-opacity="0"/></radialGradient></defs>
    </svg>${f}${bolts}
    <div class="abs label" style="left:28px;bottom:24px;color:#bbb">food → energy</div></div>`;
}
function mgSleep(x, y, w, h) {
  const zs = [0, 1, 2].map(k => { const q = ((T * 0.35 + k / 3) % 1);
    return `<div class="abs disp" style="left:${150 + q * 120}px;top:${170 - q * 140}px;font-size:${30 + q * 30}px;font-weight:900;color:#fff;opacity:${Math.sin(q * Math.PI)}">Z</div>`; }).join("");
  return `<div class="abs dark" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;overflow:hidden;background:linear-gradient(160deg,#1B1B3A,#0E0E10)">
    <div class="abs" style="left:46px;top:${48 + 8 * floaty(1, 1.2)}px;font-size:120px">🌙</div>${zs}
    <div class="abs" style="right:40px;bottom:30px;font-size:${70 + 8 * Math.sin(T * 7)}px">🔥</div>
    <div class="abs label" style="right:36px;top:30px;color:#bbb">still burning</div></div>`;
}
function mgMito(x, y, w, h) {
  const cx = w / 2, cy = h / 2, rx = w * 0.36, ry = h * 0.24, g = 0.6 + 0.4 * Math.sin(T * 3);
  let cr = ""; for (let i = 0; i <= 40; i++) { const u = i / 40; cr += `${i ? "L" : "M"} ${cx - rx * 0.85 + u * rx * 1.7} ${cy + Math.sin(u * Math.PI * 7 + T * 2) * ry * 0.55} `; }
  const atp = [...Array(8)].map((_, k) => { const q = ((T * 0.5 + k / 8) % 1), a = k / 8 * 2 * Math.PI;
    return `<text x="${cx + Math.cos(a) * (rx + 20 + q * 120)}" y="${cy + Math.sin(a) * (ry + 20 + q * 90)}" font-size="22" font-weight="800" fill="#FFB0B2" opacity="${1 - q}">ATP</text>`; }).join("");
  return `<div class="abs dark" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;overflow:hidden;background:radial-gradient(circle at 50% 50%,#3A0D10,#0E0E10 70%)">
    <svg class="abs" style="left:0;top:0" width="${w}" height="${h}">
      <ellipse cx="${cx}" cy="${cy}" rx="${rx + 18}" ry="${ry + 18}" fill="none" stroke="#E0262B" stroke-width="3" opacity="${g * .6}" filter="url(#bl)"/>
      <defs><filter id="bl"><feGaussianBlur stdDeviation="8"/></filter></defs>
      <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#B3171C" stroke="#FF7A7D" stroke-width="10"/>
      <path d="${cr}" fill="none" stroke="#FFC2C4" stroke-width="8" stroke-linejoin="round"/>${atp}</svg>
    <div class="abs label" style="left:28px;bottom:24px;color:#FFB0B2">mitochondria · your power plants</div></div>`;
}
function mgThermo(x, y, w, h, p) {
  const col = `rgb(${Math.round(lerp(59, 224, p))},${Math.round(lerp(130, 38, p))},${Math.round(lerp(246, 43, p))})`;
  const lvl = lerp(0.12, 0.92, easeOut(p)), tube = h - 170;
  return `<div class="abs card" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;overflow:hidden">
    <svg class="abs" style="left:${w / 2 - 60}px;top:30px" width="120" height="${h - 40}">
      <rect x="35" y="0" width="50" height="${tube}" rx="25" fill="#EEE"/>
      <rect x="47" y="${tube * (1 - lvl)}" width="26" height="${tube * lvl + 20}" rx="13" fill="${col}"/>
      <circle cx="60" cy="${tube + 40}" r="48" fill="${col}"/></svg>
    <div class="abs disp" style="left:0;right:0;bottom:24px;text-align:center;font-size:30px;font-weight:900;color:${col}">${p < 1 ? "warming up…" : "ready 🔥"}</div>
    <div class="abs" style="right:22px;top:${30 + tube * (1 - lvl) - 10}px;font-size:22px;font-weight:800;color:#6B6862">muscle temp ↑</div></div>`;
}
function mgHeart(x, y, w, h, t0) {
  const ph = ((T - t0) % 0.85) / 0.85, beat = ph < 0.12 ? 1 + 0.18 * Math.sin(ph / 0.12 * Math.PI) : (ph > .26 && ph < .36 ? 1 + 0.1 * Math.sin((ph - .26) / .1 * Math.PI) : 1);
  let pts = ""; for (let i = 0; i <= 120; i++) { const u = i / 120, q = ((u * 3 - (T - t0) / 0.85) % 1 + 1) % 1;
    const yv = q < .06 ? -q * 300 : q < .1 ? -18 + (q - .06) * 1500 : q < .14 ? 42 - (q - .1) * 1050 : 0; pts += `${u * (w - 60)},${100 + yv} `; }
  return `<div class="abs dark" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;overflow:hidden">${leaks(.4)}
    <div class="abs" style="left:0;right:0;top:50px;text-align:center;font-size:170px;transform:scale(${beat})">❤️</div>
    <svg class="abs" style="left:30px;top:${h - 310}px" width="${w - 60}" height="180"><polyline points="${pts}" fill="none" stroke="#E0262B" stroke-width="5" stroke-linejoin="round"/></svg>
    <div class="abs disp" style="left:0;right:0;bottom:36px;text-align:center;font-size:44px;font-weight:900;color:#fff">Easy, steady pace</div></div>`;
}
function mgProtein(w, h, at) {
  const kg = 70, g = Math.round(kg * 1.6 * easeOut(prog(at + .3, at + 1.5)));
  const items = ["🥚", "🍗", "🫘", "🥛", "🧀"];
  return `<div class="abs" style="left:0;top:0;width:${w}px;height:${h}px;background:var(--red-soft);overflow:hidden">
    ${items.map((e, k) => { const a = T * 0.8 + k / items.length * 2 * Math.PI; return `<div class="abs" style="left:${w / 2 - 30 + Math.cos(a) * 170}px;top:${h / 2 - 34 + Math.sin(a) * 105}px;font-size:56px">${e}</div>`; }).join("")}
    <div class="abs disp" style="left:0;right:0;top:${h / 2 - 50}px;text-align:center;font-size:64px;font-weight:900;color:var(--red)">${g} g</div>
    <div class="abs" style="left:0;right:0;top:${h / 2 + 22}px;text-align:center;font-size:22px;font-weight:700;color:#6B6862">for a 70 kg person</div></div>`;
}
function mgSleepClock(w, h, at) {
  const p = easeOut(prog(at + .3, at + 1.6)), R = 105, circ = 2 * Math.PI * R, frac = 8 / 12;
  return `<div class="abs" style="left:0;top:0;width:${w}px;height:${h}px;background:linear-gradient(160deg,#1B1B3A,#0E0E10);overflow:hidden">
    <svg class="abs" style="left:${w / 2 - 130}px;top:${h / 2 - 130}px" width="260" height="260"><circle cx="130" cy="130" r="${R}" stroke="rgba(255,255,255,.12)" stroke-width="22" fill="none"/>
      <circle cx="130" cy="130" r="${R}" stroke="#E0262B" stroke-width="22" fill="none" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ * (1 - frac * p)}" transform="rotate(-90 130 130)"/></svg>
    <div class="abs" style="left:0;right:0;top:${h / 2 - 50}px;text-align:center;font-size:84px;transform:translateY(${6 * floaty(2, 1.5)}px)">🌙</div></div>`;
}
function mgSteps(w, h, at) {
  const n = Math.round(8000 * easeOut(prog(at + .2, at + 2)));
  const feet = [0, 1, 2, 3, 4].map(k => { const q = ((T * 0.6 + k / 5) % 1); return `<div class="abs" style="left:${q * (w - 60)}px;top:${h - 90 + (k % 2) * 26}px;font-size:40px;opacity:${Math.sin(q * Math.PI)};transform:rotate(90deg)">👣</div>`; }).join("");
  return `<div class="abs" style="left:0;top:0;width:${w}px;height:${h}px;background:#141416;overflow:hidden">
    <div class="abs disp" style="left:0;right:0;top:${h / 2 - 90}px;text-align:center;font-size:96px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums">${n.toLocaleString("en-US")}</div>
    <div class="abs label" style="left:0;right:0;top:${h / 2 + 20}px;text-align:center;color:#bbb">steps today</div>${feet}</div>`;
}
function mgReps(x, y, sc) {
  const lt = T - sc.start, rep = Math.floor(lt / 2.6) % 10 + 1, ph = (lt % 2.6) / 2.6;
  const R = 58, circ = 2 * Math.PI * R;
  return `<div class="abs card" style="left:${x}px;top:${y}px;width:300px;height:190px;${appear(sc.start + .6)}">
    <svg class="abs" style="left:24px;top:30px" width="130" height="130"><circle cx="65" cy="65" r="${R}" stroke="#EEE" stroke-width="12" fill="none"/>
      <circle cx="65" cy="65" r="${R}" stroke="#E0262B" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ * (1 - ph)}" transform="rotate(-90 65 65)"/></svg>
    <div class="abs disp" style="left:24px;top:62px;width:130px;text-align:center;font-size:46px;font-weight:900">${rep}</div>
    <div class="abs label" style="left:172px;top:52px">Rep</div>
    <div class="abs" style="left:172px;top:86px;font-size:26px;font-weight:800;line-height:1.25">slow &amp;<br>controlled</div></div>`;
}

// ---------- stick-figure rig (2-bone IK) ----------
const L = { thigh: 95, shin: 95, torso: 140, upper: 66, fore: 62, neck: 18, head: 24 };
function ik(a, b, l1, l2, bend) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  let d = Math.hypot(dx, dy); d = Math.min(d, l1 + l2 - 0.01);
  const ang = Math.atan2(dy, dx);
  const cos = clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1);
  const off = Math.acos(cos) * bend;
  return [a[0] + l1 * Math.cos(ang + off), a[1] + l1 * Math.sin(ang + off)];
}
const D2R = Math.PI / 180;
function mixPose(A, B, p) {
  const m = (u, v) => Array.isArray(u) ? u.map((x, i) => lerp(x, v[i], p)) : (typeof u === "number" ? lerp(u, v, p) : u);
  const o = {}; for (const k in A) o[k] = Array.isArray(A[k]) && Array.isArray(A[k][0]) ? A[k].map((q, i) => m(q, B[k][i])) : m(A[k], B[k]);
  return o;
}
// pose: hip, torso(deg, 90 = up), hands[2], feet[2] (ankles), knee/elbow bend signs, face dir
function drawFigure(P, hi = []) {
  const hip = P.hip, ta = P.torso * D2R;
  const sh = [hip[0] + L.torso * Math.cos(ta), hip[1] - L.torso * Math.sin(ta)];
  const neckEnd = [sh[0] + L.neck * Math.cos(ta), sh[1] - L.neck * Math.sin(ta)];
  const head = [neckEnd[0] + L.head * Math.cos(ta + (P.headTilt ?? 0) * D2R), neckEnd[1] - L.head * Math.sin(ta + (P.headTilt ?? 0) * D2R)];
  const ink = "#16161A", red = "#E0262B";
  const col = part => hi.includes(part) ? red : ink;
  let s = "";
  const seg = (a, b, c, w) => `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
  const legs = [], arms = [];
  P.feet.forEach((f, i) => {
    const knee = ik(hip, f, L.thigh, L.shin, P.kneeBend[i]);
    const toe = [f[0] + (P.toeDir?.[i] ?? 1) * 34 * Math.cos((P.toeAng?.[i] ?? 0) * D2R), f[1] - 34 * Math.sin((P.toeAng?.[i] ?? 0) * D2R)];
    legs.push({ knee, f, toe, far: i === 1 });
  });
  P.hands.forEach((h, i) => { arms.push({ el: ik(sh, h, L.upper, L.fore, P.elbowBend[i]), h, far: i === 1 }); });
  const legCol = { thigh: col("thigh"), ham: col("hamstring") };
  const drawLeg = (g, alpha) => {
    const thighC = hi.includes("thigh") || hi.includes("hamstring") ? red : ink;
    s += `<g opacity="${alpha}">` + seg(hip, g.knee, thighC, 30) + seg(g.knee, g.f, hi.includes("calf") ? red : ink, 24) + seg(g.f, g.toe, ink, 16) + `</g>`;
  };
  const drawArm = (g, alpha) => {
    s += `<g opacity="${alpha}">` + seg(sh, g.el, hi.includes("upperarm") || hi.includes("shoulder") ? red : ink, 22) + seg(g.el, g.h, hi.includes("forearm") ? red : ink, 18) + `</g>`;
  };
  legs.filter(l => l.far).forEach(l => drawLeg(l, .45));
  arms.filter(a => a.far).forEach(a => drawArm(a, .45));
  // torso as a tapered quad
  const nx = -Math.sin(ta), ny = -Math.cos(ta);
  const torsoC = (hi.includes("core") || hi.includes("back") || hi.includes("chest")) ? red : ink;

let TL = null;
const CHAPTER_OF = id => id < "s03" ? "The Engine" : id < "s13" ? "The Workout" : "The Plan";
window.setTimeline = tl => { TL = tl; };
function frameHTML(t, opts = {}) {
  T = t;
  const sc = TL.scenes.find(s => t >= s.start && t < s.end) || TL.scenes[TL.scenes.length - 1];
  const darkScene = ["chapter", "stinger", "endcard", "hook"].includes(sc.kind);
  let h = darkScene ? "" : BG;
  h += (S[sc.kind] || (() => ""))(sc);
  // scene-in wipe
  const since = t - sc.start;
  if (since < 0.35 && sc.kind !== "hook") h += `<div class="abs" style="inset:0;background:var(--red);transform:translateX(${easeInOut(since / 0.35) * 100}%);z-index:70"></div>`;
  if (opts.chrome !== false && !["chapter", "stinger", "endcard"].includes(sc.kind)) {
    const cap = TL.captions.find(c => t >= c.s && t < c.e);
    if (cap) h += `<div class="caption">${cap.words.map((w, i) => `<span class="box ${i === cap.hl ? "r" : ""}" style="${appear(cap.s + i * 0.04, { dy: 14, scale: .9, dur: .3 })}">${w.replace(/[,.:;]$/, "")}</span>`).join("")}</div>`;
    h += `<div class="progress" style="width:${1920 * t / TL.duration}px"></div>`;
    if (!darkScene) h += `<div class="chapterTag"><b>●</b> ${CHAPTER_OF(sc.id)}</div>`;
    h += `<div class="abs" style="right:56px;top:30px;z-index:60;font-size:22px;font-weight:800;letter-spacing:.04em;color:${darkScene ? "rgba(255,255,255,.75)" : "rgba(18,18,18,.55)"}"><span style="color:var(--red)">▶</span> ${window.HANDLE || "@drmakfitness"}</div>`;
  }
  let kick = 0;
  for (const p of TL.punches || []) if (t >= p && t < p + 0.8) kick = Math.max(kick, Math.exp(-(t - p) * 6));
  if (kick > 0.001) h = `<div class="abs" style="inset:0;transform:scale(${1 + 0.05 * kick}) translate(${Math.sin(t * 95) * 7 * kick}px,${Math.cos(t * 83) * 5 * kick}px)">${h}</div><div class="abs" style="inset:0;z-index:80;pointer-events:none;background:rgba(224,38,43,${0.16 * kick * kick})"></div>`;
  return h;
}
window.renderAt = t => { document.getElementById("stage").innerHTML = frameHTML(t); };

let SHORT = null;
window.setShort = cfg => {
  SHORT = cfg; window.HANDLE = cfg.handle;
  document.documentElement.style.cssText = "width:1080px;height:1920px";
  document.body.style.cssText = "width:1080px;height:1920px;background:#0E0E10";
  document.body.innerHTML = `<div id="sbg" class="abs" style="inset:0"></div>
    <div id="swrap" class="abs" style="left:24px;top:600px;width:1032px;height:581px;border-radius:28px;overflow:hidden;box-shadow:0 0 0 3px rgba(224,38,43,.85),0 0 60px rgba(224,38,43,.35)">
      <div id="stage" style="position:absolute;left:0;top:0;width:1920px;height:1080px;transform:scale(${1032 / 1920});transform-origin:0 0;overflow:hidden;background:var(--paper)"></div></div>
    <div id="sover" class="abs" style="inset:0"></div>`;
};
function shortCaption(t) {
  const cap = TL.captions.find(c => t >= c.s && t < c.e);
  if (!cap) return "";
  return `<div class="abs" style="left:60px;right:60px;top:1250px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px">${cap.words.map((w, i) =>
    `<span class="disp" style="display:inline-block;font-weight:900;font-size:76px;padding:6px 20px;border-radius:16px;background:${i === cap.hl ? "var(--red)" : "#fff"};color:${i === cap.hl ? "#fff" : "#111"};${appear(cap.s + i * 0.05, { dy: 24, scale: .85, dur: .3 })}">${w.replace(/[,.:;]$/, "")}</span>`).join("")}</div>`;
}
window.renderShort = t => {
  const c = SHORT, bg = document.getElementById("sbg"), over = document.getElementById("sover"), wrap = document.getElementById("swrap");
  T = t;
  bg.innerHTML = leaks(.9);
  if (t < c.b) {
    wrap.style.display = "block";
    document.getElementById("stage").innerHTML = frameHTML(t, { chrome: false });
    T = t;
    let o = `<div class="abs" style="left:60px;top:170px;font-size:30px;font-weight:800;color:rgba(255,255,255,.8)"><span style="color:var(--red)">▶</span> ${c.handle}</div>`;
    o += `<div class="abs disp" style="left:60px;right:60px;top:250px;color:#fff;font-size:${c.title[0].length > 18 ? 70 : 84}px;font-weight:900;line-height:1.02;${appear(c.a + .05, { dy: 50 })}">${c.title[0]}</div>`;
    o += `<div class="abs disp" style="left:56px;top:${c.title[0].length > 18 ? 420 : 440}px;${appear(c.a + .25, { dy: 50, scale: .8 })}"><span style="display:inline-block;background:var(--red);color:#fff;font-size:${c.title[1].length > 16 ? 72 : 92}px;font-weight:900;padding:2px 22px;border-radius:18px;box-shadow:0 0 50px rgba(224,38,43,.55)">${c.title[1]}</span></div>`;
    o += shortCaption(t);
    o += `<div class="abs" style="left:24px;top:1196px;height:8px;border-radius:4px;background:var(--red);width:${1032 * clamp((t - c.a) / (c.b - c.a))}px"></div>`;
    if (c.save && t > c.save) o += `<div class="abs pill" style="left:60px;top:1500px;background:#fff;color:#111;font-size:36px;${appear(c.save, { scale: .7 })}">📌 Save this for the gym</div>`;
    over.innerHTML = o;
  } else {
    wrap.style.display = "none";
    const tt = t - c.b, click = c.b + 1.1, clicked = t >= click, press = clicked && t < click + .15 ? .85 : 1;
    const cp = easeInOut(prog(c.b + .5, click - .05));
    const ig = c.platform === "ig";
    over.innerHTML = `${ribbon("r", .7)}
      <div class="abs" style="left:390px;top:430px;width:300px;height:300px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 8px var(--red),0 0 80px rgba(224,38,43,.6);${appear(c.b + .05, { scale: .6 })}">
        <img src="${img("side", false)}" style="position:absolute;width:330%;height:330%;left:-118%;top:-38%;object-fit:cover;filter:grayscale(1) contrast(1.1)"></div>
      <div class="abs disp" style="left:0;right:0;top:790px;text-align:center;color:#fff;font-size:96px;font-weight:900;${appear(c.b + .2)}">Dr Mak Fitness</div>
      <div class="abs" style="left:0;right:0;top:910px;text-align:center;color:var(--red);font-size:50px;font-weight:800;${appear(c.b + .3)}">${c.handle}</div>
      <div class="abs" style="left:0;right:0;top:1000px;text-align:center;color:#bbb;font-size:38px;font-weight:600;${appear(c.b + .4)}">${c.tail}</div>
      <div class="abs" style="left:0;right:0;top:1130px;text-align:center;${appear(c.b + .5)}"><span style="display:inline-block;transform:scale(${press});padding:26px 70px;border-radius:999px;font-weight:900;font-size:56px;color:#fff;
        background:${clicked ? "#2A2A2E" : "var(--red)"};box-shadow:${clicked ? "none" : "0 0 60px rgba(224,38,43,.75)"}">${clicked ? (ig ? "✓ Following" : "✓ Subscribed") : (ig ? "Follow" : "▶ Subscribe")}</span></div>
      <svg class="abs" style="left:${lerp(760, 600, cp)}px;top:${lerp(1500, 1190, cp)}px;${tt < .5 ? "opacity:0" : ""}" width="70" height="80"><path d="M5 5 L5 60 L20 47 L31 70 L41 66 L30 43 L50 43 Z" fill="#fff" stroke="#111" stroke-width="3" transform="scale(${press})"/></svg>
      <div class="abs" style="inset:0;background:#000;opacity:${prog(c.end - .4, c.end)}"></div>`;
  }
};
</script>
<script src="verticals.js"></script>
</body>
</html>
