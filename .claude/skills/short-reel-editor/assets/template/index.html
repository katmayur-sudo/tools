<!doctype html>
<html lang="en" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="assets/lib/gsap.min.js"></script>
<!-- captions.js is generated by scripts/captions.py: CAPS, MODES, END, WARP -->
<script src="assets/captions.js"></script>
<style>
@font-face{font-family:Inter;font-weight:500;src:url(assets/fonts/inter-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:600;src:url(assets/fonts/inter-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:700;src:url(assets/fonts/inter-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:800;src:url(assets/fonts/inter-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:900;src:url(assets/fonts/inter-latin-900-normal.woff2) format("woff2")}
/* never name a family Serif / Monospace: CSS treats it as the generic and the font silently doesn't load */
@font-face{font-family:ISerif;font-style:italic;src:url(assets/fonts/instrument-serif-latin-400-italic.woff2) format("woff2")}
@font-face{font-family:ISerif;font-style:normal;src:url(assets/fonts/instrument-serif-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Mono;src:url(assets/fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2")}
:root{--bg:#F4F3EF;--ink:#161616;--blue:#2E5BFF;--orange:#D97757;--yellow:#FFE14D;--line:#E3E1DB;--green:#1FB45A;--red:#E5484D;--grey:#8a877f}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
#root{position:relative;width:1080px;height:1920px;background:var(--bg);font-family:Inter,sans-serif;color:var(--ink)}
.abs{position:absolute}
.hid{opacity:0;visibility:hidden}
#stage{left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0;visibility:hidden}
/* mode A scenes: author in 1080x1920 (graphics y 100-1020), squeezed into y 215-896 above the caption */
.scene.Ag{transform-origin:540px 100px;transform:translateY(115px) scale(.74)}
#spkC{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;z-index:4;opacity:0;visibility:hidden}
#spkC video{width:100%;height:100%;object-fit:cover;transform-origin:50% 36%}
#spkA{position:absolute;left:50px;top:1082px;width:980px;height:720px;border-radius:44px;overflow:hidden;z-index:5;opacity:0;visibility:hidden}
#spkA video{width:100%;height:100%;object-fit:cover;transform-origin:50% 40%}
#caps{position:absolute;left:0;top:0;width:1080px;height:1920px;z-index:8;pointer-events:none}
.cap{position:absolute;left:70px;width:940px;text-align:center;opacity:0;visibility:hidden}
.cap span{opacity:0}
.cap.A{top:945px;height:100px;line-height:100px;font-weight:500;font-size:74px;letter-spacing:-.02em;color:var(--ink)}
.cap.B{top:1190px;font-family:ISerif;font-style:italic;font-size:124px;line-height:.95;text-transform:uppercase;letter-spacing:-.01em}
.cap.B.blue{color:var(--blue)}
.card{background:#fff;border:2px solid var(--line);border-radius:30px;box-shadow:0 24px 60px rgba(20,20,20,.10)}
.chip{display:inline-flex;align-items:center;gap:14px;padding:14px 30px;border-radius:999px;font-weight:800;font-size:44px;white-space:nowrap}
.mono{font-family:Mono}
.cover{position:absolute;left:62px;width:956px;text-align:center;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.5)}
.csmall{font-family:ISerif;font-style:italic;font-size:64px;line-height:1.05}
.cbig{font-weight:900;font-size:112px;line-height:.92;letter-spacing:-.03em;text-transform:uppercase}
.shade{position:absolute;left:0;top:560px;width:1080px;height:1360px;background:linear-gradient(transparent,rgba(0,0,0,.5) 45%,rgba(0,0,0,.25))}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920">
  <div id="stage" class="abs">

    <!-- EXAMPLE mode A scene: a UI card above the caption (replace with the real B-roll) -->
    <div id="s-demoA" class="scene Ag">
      <div id="dA" class="card abs" style="left:110px;top:150px;width:860px;height:760px;padding:50px">
        <div class="mono" style="font-size:28px;letter-spacing:.14em;color:var(--orange)">01 · EXAMPLE</div>
        <div style="margin-top:20px;font-size:64px;font-weight:900;letter-spacing:-.03em">Replace me with real B-roll</div>
        <div id="dAbar" class="abs" style="left:50px;bottom:60px;width:760px;height:26px;border-radius:13px;background:#E3E1DB;overflow:hidden"><div id="dAfill" style="width:100%;height:100%;background:var(--blue);transform-origin:0 50%;transform:scaleX(0)"></div></div>
      </div>
    </div>

    <!-- EXAMPLE mode B typeset line (use for look-downs / quick head drops) -->
    <div id="s-type" class="scene">
      <div id="ty1" class="abs" style="left:0;top:600px;width:1080px;text-align:center;font-family:ISerif;font-style:italic;font-size:118px;line-height:1"></div>
      <div id="ty2" class="abs" style="left:0;top:740px;width:1080px;text-align:center;font-family:ISerif;font-style:italic;font-size:168px;line-height:1;color:var(--blue);text-transform:uppercase"></div>
    </div>

    <!-- full-face cover text (mode C), built by cover() -->
    <div id="c-ov" class="abs" style="left:0;top:0;width:1080px;height:1920px;z-index:7;pointer-events:none"></div>

    <!-- talking head layers from scripts/crop.py (one fixed crop). zC/zA carry the ease zooms, the videos carry the jump-cut punch-ins -->
    <div id="spkC"><div id="zC" style="width:100%;height:100%;transform-origin:50% 36%"><video id="vC" class="clip" src="assets/talk_c.mp4" data-start="0" data-duration="20" data-track-index="0" muted playsinline></video></div></div>
    <div id="spkA"><div id="zA" style="width:100%;height:100%;transform-origin:50% 40%"><video id="vA" class="clip" src="assets/talk_a.mp4" data-start="0" data-duration="20" data-track-index="1" muted playsinline></video></div></div>
    <div id="caps"></div>
  </div>
</div>

<script>
(function(){
const END=window.END;
const TL=gsap.timeline({paused:true});
// times you author below may be on an older cut: M() maps them through WARP (identity when nothing was re-cut)
const M=t=>{for(const [oa,ob,na,nb] of WARP){if(t<ob)return Math.min(nb,na+Math.max(0,t-oa))}return END};
const tl={set:(a,b,p)=>TL.set(a,b,M(p)),to:(a,b,p)=>TL.to(a,b,M(p)),fromTo:(a,b,c,p)=>TL.fromTo(a,b,c,M(p))};
const q=s=>document.querySelector(s), qa=s=>[...document.querySelectorAll(s)];
const mk=(tag,css,html,parent)=>{const e=document.createElement(tag);if(css)e.style.cssText=css;if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e};
function scene(sel,a,b){tl.set(sel,{autoAlpha:1},a);tl.set(sel,{autoAlpha:0},b)}
function pop(el,t,o={}){const els=typeof el==="string"?qa(el):(el.length!=null?[...el]:[el]);els.forEach(e=>{e.style.opacity=0;e.style.visibility="hidden"});tl.fromTo(els,{autoAlpha:0,scale:o.s??.6,y:o.y??0,x:o.x??0,rotation:o.r??0},{autoAlpha:1,scale:1,y:0,x:0,rotation:o.r2??0,duration:o.d??.38,ease:o.ease??"back.out(2)",stagger:o.st??0,immediateRender:false},t)}
function typeInto(el,text,t0,t1){const chars=[...text];el.innerHTML="";chars.map(c=>{const e=mk("span","opacity:0",null,el);e.textContent=c;return e}).forEach((s,i)=>tl.set(s,{opacity:1},t0+(t1-t0)*i/chars.length))}
function count(el,from,to,t0,t1,steps,fmt){for(let k=0;k<=steps;k++){const v=from+(to-from)*k/steps;tl.set(el,{textContent:fmt(v)},t0+(t1-t0)*k/steps)}}
// word-synced words: [[word, time], ...] appended to el
function words(el,list,big){list.forEach(([w,t])=>{const sp=mk("span",big?"display:inline-block;opacity:0":"opacity:0",w,el);mk("span",""," ",el);big?tl.fromTo(sp,{opacity:0,y:40},{opacity:1,y:0,duration:.22,ease:"power3.out",immediateRender:false},t):tl.set(sp,{opacity:1},t)})}

/* ---------------- talking head: modes, ease zooms, jump-cut punch-ins ---------------- */
MODES.forEach(([t,m],i)=>{
  const nxt=i+1<MODES.length?MODES[i+1][0]:END;
  TL.set("#spkC",{autoAlpha:m==="C"?1:0},t);
  TL.set("#spkA",{autoAlpha:m==="A"?1:0},t);
  if(m==="C"){TL.fromTo("#zC",{scale:1.07},{scale:1,duration:.45,ease:"power3.out",immediateRender:false},t);TL.to("#zC",{scale:1.05,duration:Math.max(.1,nxt-t-.45),ease:"sine.inOut"},t+.45)}
  if(m==="A"){TL.set("#spkA",{y:60},t);TL.to("#spkA",{y:0,duration:.35,ease:"power3.out"},t);TL.fromTo("#zA",{scale:1},{scale:1.05,duration:nxt-t,ease:"sine.inOut",immediateRender:false},t)}
});
// every segment of the cut alternates 1.0 / 1.08 from the same centre, so jump cuts read as zooms
WARP.forEach(([oa,ob,na,nb],k)=>TL.set(["#vC","#vA"],{scale:k%2?1.08:1},na));

/* ---------------- captions (A / B) ---------------- */
const capsEl=q("#caps");
CAPS.forEach(c=>{
  const el=mk("div","",null,capsEl);el.className="cap "+c.m+(c.blue?" blue":"");
  c.words.forEach(([w,t],k)=>{const sp=mk("span","",null,el);sp.textContent=(k?" ":"")+w;TL.set(sp,{opacity:1},t)});
  TL.fromTo(el,{autoAlpha:0,scale:c.m==="B"?.92:.86},{autoAlpha:1,scale:1,duration:.1,ease:"back.out(2.5)",immediateRender:false},c.t);
  TL.set(el,{autoAlpha:0},c.e);
});

/* ---------------- C cover text: cover(t0, t1, small words, big words, twoLine) ---------------- */
function cover(t0,t1,small,big,two){
  const g=mk("div","position:absolute;inset:0;opacity:0;visibility:hidden","",q("#c-ov"));
  mk("div","",null,g).className="shade";
  if(small&&small.length){const s=mk("div",`top:${two?1250:1330}px`,null,g);s.className="cover csmall";small.forEach(([w,t])=>{const sp=mk("span","opacity:0",w+" ",s);tl.set(sp,{opacity:1},t)})}
  if(big&&big.length){const b=mk("div",`top:${two?1325:1405}px;${two?'font-size:104px':''}`,null,g);b.className="cover cbig";
    big.forEach(([w,t,br])=>{if(br)mk("br","",null,b);const sp=mk("span","display:inline-block;opacity:0",w,b);mk("span",""," ",b);tl.fromTo(sp,{opacity:0,scale:1.5},{opacity:1,scale:1,duration:.2,ease:"power4.out",immediateRender:false},t)})}
  tl.set(g,{autoAlpha:1},t0);tl.set(g,{autoAlpha:0},t1);
}

/* ======== EXAMPLES — replace with the reel's beats (times = word starts from words_cut.json) ======== */
cover(0.0,3.0,[["I",0.1],["spent",0.3]],[["3",0.8],["days",1.1]]);
scene("#s-demoA",3.0,8.0);
pop("#dA",3.05,{s:.92,y:60,ease:"power3.out",d:.35});
tl.to("#dAfill",{scaleX:1,duration:4,ease:"power1.inOut"},3.4);
scene("#s-type",8.0,12.0);
words(q("#ty1"),[["but",8.1],["getting",8.4],["there",8.7]]);
words(q("#ty2"),[["took",9.2],["a",9.4],["while",9.5]],true);
cover(16.0,END,[],[["Comment",16.3],["“keyword”",16.9,1]],true);

TL.set({}, {}, END);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=TL;
TL.seek(0);
})();
</script>
</body>
</html>
